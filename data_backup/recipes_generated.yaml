- recipe_id: 29
  name: Karotten-Thunfisch-Salat
  recipe_type: snack
  cook_minutes: null
  prep_minutes: null
  sweet: false
  variant_of: null
  veg_type: meat
  instructions: 'Karotten putzen, fein raspeln. Thunfisch abtropfen, zerkleinern und

    zusammen mit den Karotten in eine Schuessel geben. Den Mais dazugeben und

    gut vermischen. Aus OEl, Essig, Senf, Salz und Pfeffer ein Dressing

    anruehren und unter den Salat mischen.'
- recipe_id: 30
  name: Kartoffel â€“ Gurken â€“ Salat mit Joghurtdressing
  recipe_type: snack
  cook_minutes: null
  prep_minutes: null
  sweet: false
  variant_of: null
  veg_type: meat
  instructions: 'Kartoffeln in der Schale kochen, etwas auskuehlen lassen, schaelen
    und in

    duenne Scheiben schneiden. Heisse Gemuesebruehe mit Liebstoeckel, Muskat

    und Piment wuerzen. Die Kartoffeln mit der heissen Gemuesebruehe, Essig und

    Zwiebel vermischen, das macht den Salat saftig. Fuer das Joghurtdressing

    Senf, Zitronensaft, Chili und Salz glatt ruehren. Zuerst das OEl

    tropfenweise, dann den Joghurt nach und nach unterruehren. Die Sosse mit

    Kraeutern und Essiggurken wuerzen und abschmecken. Das Joghurtdressing

    unter den Salat mischen, etwas durchziehen lassen. Die Gurken erst kurz vor

    dem Servieren unterheben.

    Beilage: 1 Wiener Wuerstchen'
- recipe_id: 31
  name: Matjessalat auf flaemische Art
  recipe_type: snack
  cook_minutes: null
  prep_minutes: null
  sweet: false
  variant_of: null
  veg_type: meat
  instructions: 'Den Salat putzen, waschen und in Streifen schneiden. Sehr gut abtropfen

    lassen und in eine Salatschuessel geben. Die abgezogene Pellkartoffeln

    zusammen mit den Matjesfilets in Wuerfel schneiden und zum Salat geben.

    Den Essig und das OEl mit dem Schneebesen verruehren. Die Zwiebel fein

    wuerfeln und zusammen mit Pfeffer, Zucker, den Kraeutern und der CrÃ¨me

    fraÃ®che zur Essig-OEl-Mischung geben und kurz verruehren. Auf die

    Salatzutaten geben und kurz vor dem Servieren alles zusammen vorsichtig

    mischen und abschmecken.

    Dazu Vollkornbrot mit Butter reichen.'
- recipe_id: 32
  name: Moehrensalat mit Pilzen
  recipe_type: snack
  cook_minutes: null
  prep_minutes: null
  sweet: false
  variant_of: null
  veg_type: vegetarian
  instructions: 'Fuer die Nachos ca. 120 ml Wasser mit 1 Prise Salz, Paprikapulver,

    Koriander und 2 EL OEl erhitzen, vom Herd nehmen, Mais- und Dinkelmehl

    zugeben und verruehren. Teig etwas auskuehlen lassen, durchkneten, sehr

    duenn ausrollen und in Dreiecke schneiden. Nachos auf ein mit Backpapier

    ausgelegtes Backblech legen und im vorgeheizten Backofen bei 200 Grad 15

    bis 20 Minuten goldbraun backen. Hirse nach Packungsanweisung zubereiten

    und abkuehlen lassen. Zuccini waschen und putzen. Zwiebel und Knoblauch

    abziehen, mit Zuccini fein wuerfeln und in 2 EL erhitzem OEl anbraten.

    Tomatenmark, Pizzatomaten und Tomatensaft zufuegen und aufkochen.

    Kidneybohnen und Mais abtropfen lassen, mit Hirse dazugeben, kurz

    miterhitzen und mit Salz, Cayennepfeffer und Kreuzkuemmel wuerzen. Salat

    waschen, lputzen und in mundgerechte Stuecke zupfen. Restliches OEl,

    Petersilie und Zitronensaft verruehren, salzen und pfeffern und mit dem

    Salat mischen. Zum Schluss Nachos und Chili auf dem Salat anrichten und

    servieren.'
- recipe_id: 33
  name: Reissalat
  recipe_type: snack
  cook_minutes: null
  prep_minutes: null
  sweet: false
  variant_of: null
  veg_type: vegetarian
  instructions: 'Bruehe auskochen. Den Reis darin bei schwacher Hitze 20 Min. garen.

    Inzwischen Bohnen und Mais abgiessen. Die Tomaten mit kochendem Wasser

    ueberbruehen, haeuten, entkernen und in Spalten schneiden. Paprika in

    kleine Rauten teilen. Fruehlingszwiebeln in Ringe schneiden. Kabanossi in

    Scheiben teilen. Chilis fein wuerfeln. Eisbergsalat zerkleinern und in eine

    Schuessel geben. Die uebrigen Zutaten mit Zitronensaft, Olivenoel, Salz und

    Pfeffer abschmecken und auf dem Eisbergsalat anrichten. Evtl. mit

    Chilischoten garnieren und mit Tortilla-Chips servieren.'
