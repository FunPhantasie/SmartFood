    Milch mit Eiern und einem Teeloeffel Salz verquirlen. Mit den Knethacken

    des Handruehrers unter das Mehl kneten. Den Teig mit den Haenden so lange

    weiterkneten, bis er weich und geschmeidig ist. Den Teig in sechs Portionen

    teilen. Jede Portion auf wenig Mehl zu einem etwa 25 cm langen und ca. 14

    cm breiten Streifen ausrollen. Jeden Teigstreifen mit fluessigem Fett

    bepinseln und mit Semmelbroeseln bestreuen. Den Streifen mit Hilfe eines

    Pfannenmessers fuenfmal jeweils 5 cm breit ueberschlagen, bis ein Rechteck

    (ca. 6x14 cm) entstanden ist. Rechteck quer halbieren. Die Schnittkanten

    zusammendrehen, damit Fett und Semmelbroesel im Kloss bleiben. Jeden Kloss

    mit einem Holzstaebchen mehrmals einstechen. In kochendes Wasser geben und

    20 Minuten garen. Herausnehmen und abtropfen lassen.

    (Beilage zu Fleisch und Gemuesegerichten).


    Reis'
