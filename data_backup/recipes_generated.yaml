  prep_minutes: null
  sweet: false
  variant_of: null
  veg_type: meat
  instructions: 'Vom Kuerbis die harte Schale abschneiden und die Kerne entfernen,
    das

    Furchtfleisch grob wuerfeln. Zwiebel und Knoblauch fein hacken. Zuerst die

    Zwiebeln in Butter anschwitzen, dann Knoblauch zugeben. Er darf keine Farbe

    annehmen, sonst wird er bitter.

    Die Kuerbiswuerfel zugeben und 5 bis 10 Minuten duensten. Mit der

    Fleischbruehe auffuellen und 15 Minuten koecheln lassen. Den Weisswein

    zugeben.

    Dann passieren oder mit dem Mixstab puerieren. Den Schmelzkaese zugeben und

    unterruehren, bis er sich aufgeloest hat. Mit wenig Salz wuerzen, viel

    frisch gemahlenen Pfeffer, Piment und eine Prise Cayennepfeffer zugeben.

    Den Ingwer untermischen, die Toastbrotwuerfel in Butter anroesten und ueber

    die Suppe geben.'
- recipe_id: 233
  name: Exotische Kuerbissuppe mit Schafskaese
