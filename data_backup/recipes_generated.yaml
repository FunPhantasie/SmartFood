  recipe_type: main_dish
  cook_minutes: null
  prep_minutes: null
  sweet: false
  variant_of: null
  veg_type: vegetarian
  instructions: 'Karotten fein raspeln. OEl in einer Pfanne erhitzen, Karotten darin

    anduensten, bis sie weich sind. Abkuehlen lassen. Joghurt und Sauerrahm

    mischen, mit Salz wuerzen, Knoblauch fein hacken und mit den Karotten unter

    die Joghurt-Sauerrahm-Masse ruehren. Mind. 2 Stunden ziehen lassen.'
