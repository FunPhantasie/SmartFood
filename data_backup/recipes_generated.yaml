- recipe_id: 247
  name: Seelachfilet auf Kuerbisgemuese
  recipe_type: main_dish
  cook_minutes: null
  prep_minutes: null
  sweet: false
  variant_of: null
  veg_type: meat
  instructions: 'Den Kuerbis schaelen und die Kerne entfernen, das Fruchtfleisch grob

