- recipe_id: 8
  name: Ingwer eingelegt ( ( (
  recipe_type: main_dish
  cook_minutes: null
  prep_minutes: null
  sweet: false
  variant_of: null
  veg_type: vegetarian
  instructions: 'Den Ingwer schaelen, in hauchduenne Streifen schneiden und ca. 2
    Min. in

    kochendem Wasser blanchieren. Je laenger der Ingwer gekocht wird, desto

    mehr verliert er an Schaerfe.


    Zucker, Reisessig und Salz in einer Schuessel verruehren, bis sich Zucker

    und Salz aufgeloest haben. Den Ingwer mit der Fluessigkeit in einen

    Behaelter fuellen, fest verschliessen und 1 Woche im Kuehlschrank ziehen

    lassen.


    Der Ingwer ist verzehrfertig, wenn er sich lachsrosa verfaerbt. Der Ingwer

    ist scharf und nicht suess, laesst sich aber durch Zuckerzugabe und/oder

    Kochzeit dem eigenen Geschmack anpassen.'
