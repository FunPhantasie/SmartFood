    Nudel-Hackauflauf, Apfelkorn-Martini, Wuerzige Pfannkuchentorte'
- recipe_id: 249
  name: Nudel-Hackauflauf
  recipe_type: main_dish
  cook_minutes: null
  prep_minutes: null
  sweet: false
  variant_of: null
  veg_type: meat
  instructions: 'Zwiebeln in feine Streifen schneiden und den Knoblauch hacken. Das

    Hackfleisch mit dem gewuerfeltem Speck in einer Pfanne im heissen OEl 3-4

    Minuten unter Ruehren scharf anbraten. Zwiebeln und Knoblauch dazugeben,

    weitere 2 Minuten anbraten. Die Pizzatomaten dazugeben und aufkochen. 10

    Minuten bei mittlerer Hitze kochen und mit Salz und Pfeffer wuerzen.

    Oregano dazugeben und aufkochen. Bei mittlere Hitze 10 Minuten sanft kochen

    lassen.

    Inzwischen die Penne in Salzwasser nach Packungsableitung garen. Die

    Hacksauce in einer ofenfeste Form fuellen und die abgegossene Penne darauf

    verteilen.

    Mit dem Butterkaese bestreuen und im vorgeheiztem Ofen 20 Minuten bei 190

    Â°C (Umluft 170Â°C) auf der 2. Schiene von unten backen.'
- recipe_id: 250
  name: Apfelkorn-Martini
  recipe_type: main_dish
  cook_minutes: null
  prep_minutes: null
  sweet: false
  variant_of: null
  veg_type: vegetarian
  instructions: Alles auf Eis kalt umruehren und in Glaeser abseihen.
- recipe_id: 251
  name: Wuerzige Pfannkuchentorte
  recipe_type: snack
  cook_minutes: null
  prep_minutes: null
  sweet: false
  variant_of: null
  veg_type: meat
  instructions: 'Das Mehl in eine Schuessel sieben und mit der Milch glattruehren.
    Etwa 15

    Minuten quellen lassen. Die Eier verquirlen und unterruehren, das OEl

    unterruehren und mit einer Prise Salz wuerzen. Eine Pfanne (24 cm) erhitzen

    und mit wenig OEl ausstreichen. Nacheinander 6 duenne CrÃªpes backen. Pfanne

    ggf. zwischendurch erneut mit OEl ausstreichen. Die gebackenen Pfannkuchen

    uebereinander auf einen Teller geben. Die AEpfel schaelen und mit einem

    Kernausstecher entkernen. AEpfel in sehr duenne Ringe schneiden, salzen und

    pfeffern und in einer Pfanne in der Butter von beiden Seiten je 3 Minuten

    braten. Mit dem Zucker bestreuen und leicht karamellisieren.

    Die Leberwurst mit Cognac, gehackte Petersilie und Schnittlauch schaumig

    ruehren. Einen Pfannkuchen mit einem fuenftel der Leberwurst bestreichen.

    Einige Apfelscheiben darauf legen und mit 4 weiteren Pfannkuchen genauso

    verfahren. Den letzten Pfannkuchen drauflegen und fest andruecken. In den

    Kuehlschrank stellen und 1 Stunde ruhen lassen. In Stuecke geschnitten

    servieren. Dazu passt ein wenig Cumberlandsauce aus dem Glas oder

    Preiselbeeren.


    Kalbsminuten-Ragout, Gefuellte Champignons, Suesssaure Moehren aus dem Ofen'
- recipe_id: 252
  name: Kalbsminuten-Ragout
  recipe_type: main_dish
  cook_minutes: null
  prep_minutes: null
  sweet: false
  variant_of: null
  veg_type: meat
  instructions: 'Die Schalotten pellen, dabei den Wurzelansatz intakt lassen und vierteln.

    Kischtomaten waschen. Das Fleisch wuerfeln. OEl in einem Braeter erhitzen

    und den Speck darin von jeder Seite knusprig braten. Herausnehmen und die

    Fleischwuerfel salzen und pfeffern. Im Fett anbraten und ebenfalls

    herausnehmen. Die Schalotten mit dem Thymian in den Braeter geben und 2-3

    Minuten unter ruehren anschwitzen. Den Wein und Bruehe angiessen und

    aufkochen. Auf die  Haelfte einkochen lassen und das Fleisch und Speck

    wieder dazugeben. Zugedeckt bei mittlerer Hitze 10 Minuten kochen. Creme

    fraiche dazu geben, salzen und pfeffern.'
- recipe_id: 253
  name: Gefuellte Champignons
  recipe_type: main_dish
  cook_minutes: null
  prep_minutes: null
  sweet: false
  variant_of: null
  veg_type: vegetarian
  instructions: 'Den Feldsalat putzen, waschen und trocken schleudern. Die Champignons

    putzen. Die Stiele herausbrechen, mit einem Loeffel vorsichtig aushoehlen,

    Stiele wuerfeln. Champignons in einem Essloeffel OEl 3 â€“ 5 Minuten braten.

    Mit Salz und Pfeffer wuerzen.

    Die Kirschtomaten waschen und halbieren. Das Toastbrot roesten und in 1 cm

    grosse Wuerfel schneiden. Parmesan grob raspeln. Pilzstiele, Tomaten,

    Toastwuerfel, Pesto, 2 El OEl und 2/3 des Parmesans vermischen. Mit Salz

    und Pfeffer wuerzen. In die Pilze fuellen.

    Den Feldsalat, 2 EL OEl und 1-2 TL Aceto Balsamico vermischen. Mit Salz und

    Pfeffer wuerzen. Den Salat und die Champignons anrichten, mit dem

    restlichem Parmesan bestreuen und servieren.'
- recipe_id: 254
  name: Suesssaure Moehren aus dem Ofen
  recipe_type: main_dish
  cook_minutes: null
  prep_minutes: null
  sweet: false
  variant_of: null
  veg_type: vegetarian
  instructions: 'Moehren schaelen, quer halbieren und laengs vierteln. Schalotten
    in feine

    Scheiben schneiden. OEl in einem Braeter erhitzen, Schalotten und Moehren

    darin 2 Minuten bei mittlerer Hitze anschwitzen. Mit Zimt bestreuen, mit

    Wein, Gemuesebruehe und Essig abloeschen und die Sultaninen dazugeben. Mit

    Zucker, Salz und Pfeffer wuerzen. Im vorgeheizten Ofen bei 200 Â°C (Umluft

    180 Â°C, Gas 4) 25 Minuten ohne Deckel schmoren lassen, dabei gelegentlich

    umruehren.'
- recipe_id: 255
  name: Haselnuss-Petersilien-Pesto
  recipe_type: snack
  cook_minutes: null
  prep_minutes: null
  sweet: false
  variant_of: null
  veg_type: vegetarian
  instructions: 'Die Haselnuesse grob hacken und in einer Pfanne ohne Fett leicht
    roesten.

    Die Petersilie waschen, Blaetter von den Zweigen zupfen und grob hacken.

    Knoblauch pellen und zerdruecken. Alles in einem Messbecher geben und mit

    dem OEl, Salz und Pfeffer puerieren. Parmesan fein reiben und untermischen.


    Curry-Linsen-Topf, Hirsebratlinge mit Balkangemuese, Tomaten-Joghurt-Salat'
- recipe_id: 256
  name: Curry-Linsen-Topf
  recipe_type: main_dish
  cook_minutes: null
  prep_minutes: null
  sweet: false
  variant_of: null
  veg_type: vegetarian
  instructions: 'Die Moehren schaelen, laengs halbieren und in schraege Stuecke schneiden.

    Die Paprika putzen, waschen und ca. 1.5 cm gross wuerfeln.. Den Blumenkohl

    in kleine Roeschen teilen. Die Zwiebel und den Knoblauch fein hacken. OEl

    in einem Topf erhitzen und die Zwiebeln, Moehren und Linsen darin anbraten.

    Drei Teeloeffel Curry und Kurkuma dazugeben und mit dem Knoblauch kurz

    anschwitzen (nicht zu lange, da es sonst bitter wird). Mit Salz und Pfeffer

    wuerzen. Den Moehrensaft und die Gemuesebruehe dazugiessen und zugedeckt

    bei mittlerer Hitze 5 Min. koecheln lassen. Schlagsahne dazugeben, erneut

    kurz aufkochen lassen. Mit Limettensaft abschmecken.'
- recipe_id: 257
  name: Hirsebratlinge
  recipe_type: main_dish
  cook_minutes: null
  prep_minutes: null
  sweet: false
  variant_of: null
  veg_type: vegetarian
  instructions: 'Die Gemuesebruehe mit dem Gemuese aufkochen und die Hirse hinein
    geben. 20

    Minuten bei mittlerer Hitze geschlossen quellen. In eine Schuessel geben

    und kurz abkuehlen lassen.

    Ei und Broesel unterruehren, in Paniermehl wenden und zu 10 Talern formen.

    OEl in einer beschichteten Pfanne erhitzen und die Taler darin von jeder

    Seite 3 â€“ 4 Minuten braten.'
- recipe_id: 258
  name: Tomaten-Joghurt-Salat
  recipe_type: snack
  cook_minutes: null
  prep_minutes: null
  sweet: false
  variant_of: null
  veg_type: vegetarian
  instructions: 'Die Tomaten waschen und in Scheiben schneiden. Auf eine Platte legen.
    Die

    Gurke waschen und laengs vierteln, entkernen und in grob wuerfeln. Die

    Zwiebeln pellen, in feine Scheiben schneiden und auf die Tomaten legen.

    Gurken, Zwiebeln und Oliven auf den Tomaten verteilen und mit Salz und

    Zucker wuerzen. Joghurt, Zitronensaft, Olivenoel, Salz und Pfeffer

    verruehren. Kurz vor dem Servieren ueber den Salat geben. Die Minze in

    feine Streifen schneiden und auf den Salat geben.


    Pichelsteiner Eintopf und Griessflammerie mit Fliederbeerkompott'
- recipe_id: 259
  name: Pichelsteiner Eintopf
  recipe_type: main_dish
  cook_minutes: null
  prep_minutes: null
  sweet: false
  variant_of: null
  veg_type: meat
  instructions: 'Das Schweine- und Rindfleisch ca. 2 cm gross wuerfeln. Die Kartoffeln
    und

    Moehren schaelen und in Scheiben schneiden. Den Wirsing putzen, den harten

    Strunk entfernen und in feine Streifen schneiden. Die Zwiebeln ebenfalls in

    feine Streifen schneiden. Das OEl in einem Topf (ca. 24 cm / 3 l Inhalt)

    erhitzen. Das Fleisch und die Zwiebeln darin 4 bis 5 Minuten scharf

    anbraten. Kraeftig mit Salz und Pfeffer wuerzen. Die Haelfte der

    Fleischmischung herausnehmen. Dann Moehren, Kartoffeln und den Wirsing auf

    dem im Topf verbliebenen Fleisch nacheinander aufschichten. Dabei jede

    Gemueseschicht leicht salzen und pfeffern. Nun das uebrige Fleisch als

    letzte Lage hinzufuegen. Die einzelnen Lagen beim Aufschichten gut

    andruecken. Die Butter in Floeckchen auf der Oberflaeche verteilen. In

    einem separaten Topf die Bruehe und den Kuemmel aufkochen und angiessen, so

    dass die Lagen vollstaendig bedeckt sind. Die Butter in Floeckchen auf der

    Oberflaeche verteilen. Zugedeckt im vorgeheizten Ofen bei 175 Â°C auf der 2.

    Schiene von unten 1Â½ Stunden garen.

    Wichtig: Waehrend der Garzeit nicht umruehren! Mit Petersilie bestreut

    servieren.'
- recipe_id: 260
  name: Griessflammerie
  recipe_type: main_dish
  cook_minutes: null
  prep_minutes: null
  sweet: false
  variant_of: null
  veg_type: vegetarian
  instructions: 'Die Vanilleschoten laengs aufschneiden und das Mark herauskratzen.
    Die Eier

    trennen. Griess mit der Haelfte des Zuckers mischen. Vanillemark und den

    Zitronenabrieb zur Milch geben. Die Milch aufkochen und das Griess-

    Zuckergemisch unter Ruehren einrieseln lassen. Den Griess bei mittlerer

    Hitze unter gelegentlichem Ruehren 3 Minuten kochen und quellen lassen. Den

    Eigelb mit einem Schuss Milch leicht verquirlen und zuegig unter den Griess

    ruehren. Das Eiweiss mit einer Prise Salz steif schlagen. Den Eischnee mit

    einem Gummispatel unter den Griess heben. 4 Foermchen oder Tassen von 125

    ml Inhalt mit kaltem Wasser ausspuelen und dann mit dem Griesspudding

    fuellen. In den Kuehlschrank stellen und auskuehlen lassen. Anschliessend

    stuerzen, mit Minze dekorieren und mit dem Ragout servieren.'
- recipe_id: 261
  name: Fliederbeerkompott
  recipe_type: main_dish
  cook_minutes: null
  prep_minutes: null
  sweet: false
  variant_of: null
  veg_type: vegetarian
  instructions: 'Mondamin mit kaltem Wasser anruehren. Die AEpfel schaelen, vierteln,

    entkernen und in Spalten schneiden. Den Fliederbeersaft mit dem Zucker

    aufkochen und die Apfelspalten darin 6 Minuten kochen. Die Speisestaerke

    einruehren und ein wenig auskuehlen lassen. Heiss mit dem Pudding

    servieren.


    Pasta mit Fisch und Blutwurst, Braten mit Maracujasosse und Bohnensalat'
- recipe_id: 262
  name: Braten mit Maracujasosse
  recipe_type: main_dish
  cook_minutes: null
  prep_minutes: null
  sweet: false
  variant_of: null
  veg_type: meat
  instructions: 'Fruchtfleisch von den Maracujas mit einem Loeffel aushoehlen. Dann
    mit

    Salz, Pfeffer, Zucker und Olivenoel mischen, 10 Minuten ziehen lassen und

    die Masse durch ein Sieb geben, um die Kerne zu entfernen. Die Gurke fein

    wuerfeln. Das Weisse der Fruehlingszwiebel in feine Ringe schneiden, fein

    wuerfeln und alles mit der Vinaigrette mischen. Den Schweinbratenaufschnitt

    auf eine Platte geben und mit der Vinaigrette servieren.'
- recipe_id: 263
  name: Bohnensalat
  recipe_type: snack
  cook_minutes: null
  prep_minutes: null
  sweet: false
  variant_of: null
  veg_type: meat
  instructions: 'Die Bohnen putzen, Zwiebeln in feine Streifen schneiden und zusammen
    mit

    den Bohnen in Salzwasser 8 Min. kochen. Abgiessen, abschrecken und gut

    abtropfen lassen. Sellerie waschen, entfaedeln und in sehr feine Scheiben

    schneiden. Essig, OEl, Zucker, Senf, Salz und Pfeffer in einer Schuessel

    verruehren. Bohnen, Sellerie und Zwiebeln dazugeben und 20 Minuten zeihen

    lassen. Gehackte Petersilie untermischen und vor dem Servieren evtl.

    abschmecken.'
- recipe_id: 264
  name: Pasta mit Fisch und Blutwurst
  recipe_type: main_dish
  cook_minutes: null
  prep_minutes: null
  sweet: false
  variant_of: null
  veg_type: meat
  instructions: 'Zwiebeln pellen und fein wuerfeln. Apfel schaelen, entkernen und
    fein

    wuerfeln. Von der Blutwurst 4 Scheiben abschneiden. Die restliche Wurst aus

    der Haut loesen und klein hacken.

    Butter in eine Pfanne aufschaeumen. Zwiebeln, Apfel und Blutwurstwuerfel

    hineingeben und unter ruehren 4 Min. braten, bis sich die Wurst aufgeloest

    hat. Majoran dazugeben, mit Cidre oder Weisswein abloeschen. Und einkochen

    lassen. Sahne dazugeben und weitere 3 Min. kochen lassen.

    Die Sosse mit dem Puerierstab kurz anpuerieren, salzen und pfeffern. Pasta

    kochen, abgiessen und mit der Sosse mischen. Den Fisch in  Scheiben

    schneiden. 2 EL OEl in einer beschichteten Pfanne erhitzen. Fisch salzen

    und pfeffern und von jeder Seite 2 Min. braten. In einer zweiten kleinen

    Pfanne die Blutwurstscheiben im restlichen OEl braten. Die Nudeln auf eine

    Platte geben, und Fisch und Blutwurst darauf verteilen.


    Entenbrust mit Chicoree, Reihenhauskartoffeln und Bananen im Knuspermantel'
- recipe_id: 265
  name: Entenbrust mit Chicoree
  recipe_type: main_dish
  cook_minutes: null
  prep_minutes: null
  sweet: false
  variant_of: null
  veg_type: meat
  instructions: 'Die Haut der Entenbrust von beiden Seiten salzen und leicht rautenfoermig

    einschneiden. In eine kalte beschichtete Pfanne geben und bei mittlerer

    Hitze knusprig auslassen (ca. 9 Minuten). Die Fleischseite mit Salz und

    Pfeffer wuerzen, Entenbrust wenden und 2 weiter Minuten braten.

    Inzwischen die Chicorees putzen, halbieren und den Strunk entfernen. Dann

    quer in 3 cm breite Streifen schneiden. Die Orangen schaelen, so dass

    saemtliche weisse haut entfernt wird und die Filets aus den Zwischenhaeuten

    loesen. Granatapfelkerne aus dem Granatapfel loesen. Zwiebeln pellen und in

    feine streifen schneiden. Pfefferschoten entkernen, fein hacken und

    dazugeben.

    Entenbrust und Chilischoten aus der Pfanne nehmen und in Alufolie gewickelt

    ruhen lassen. Das fett aus der Pfanne giessen, dann zwiebeln und Chicoree

    hineingeben und bei starker Hitze 30 Sekunden anbraten. Chilischoten,

    Orangenfilets und Orangenmarmelade dazugeben und eine Minute koecheln.

    Granatapfelkerne untermischen und mit Salz und Pfeffer wuerzen.

    Das Chicoreegemuese mit der in Scheiben geschnittenen Ente servieren.'
- recipe_id: 266
  name: Reihenhauskartoffeln
  recipe_type: main_dish
  cook_minutes: null
  prep_minutes: null
  sweet: false
  variant_of: null
  veg_type: vegetarian
  instructions: 'Kartoffeln waschen, schaelen und in Wuerfel von ca. 3 cm Kantenlaenge

    schneiden. Anschliessend in kochendem Salzwasser 4 Min. blanchieren,

    abgiessen und gut abtropfen lassen

    Butterschmalz in einer beschichteten Pfanne erhitzen und Kartoffelwuerfel

    bei hoher Hitze unter Schwenken rundherum goldbraun braten. Petersilie

    hacken und unter die gebratenen Kartoffeln mischen und mit Salz und Pfeffer

    wuerzen.'
- recipe_id: 267
  name: Bananen im Knuspermantel
  recipe_type: main_dish
  cook_minutes: null
  prep_minutes: null
  sweet: false
  variant_of: null
  veg_type: meat
  instructions: 'Die Bananen schaelen und so einritzen, dass eine Kerbe entsteht.
    Ein Ei

    verquirlen und den Teig damit bestreichen. Die Kuvertuere auf dem Wasserbad

    schmelzen und mit einem Spritzbeutel in die Banane fuellen. Die Banane im

    Fruehlingsrollenteig einwickeln. In Olivenoel von allen Seiten knusprig

    anbraten und mit Vanilleeiscreme servieren.


    Umzugssuppe, Zitronenkuchen und Tims Saurer'
- recipe_id: 268
  name: Umzugssuppe
  recipe_type: main_dish
  cook_minutes: null
  prep_minutes: null
  sweet: false
  variant_of: null
  veg_type: meat
  instructions: 'Die Zwiebeln schaelen und in feine Streifen schneiden. In einem Topf
    mit

    dem Lorbeer anschwitzen und mit dem Paprikapulver und Tomatenmark

    vermischen. Die Dosentomaten dazugeben. Das Sauerkraut in den Topf geben

    und eine Minute mit anschwitzen. Den Weisswein angiessen und vollstaendig

    einkochen lassen. Die Bruehe angiessen und zum Kochen bringen.

    Pfefferkoerner und Majoran dazugeben und bei mittlerer Hitze 15 Minuten

    kochen.

    Am Ende der Garzeit das Kalbsbraet zu kleinen Kloesschen abstechen und

    vorsichtig in die kochende Suppe geben. Die Mehlbuedel (je nach

    Packungsanweisung) dazugeben und alles bei milder Hitze gar zeihen lassen.

    Mit Salz und Pfeffer wuerzen. Zum Schluss  mit der sauren Sahne servieren.'
- recipe_id: 269
  name: Zitronenkuchen
  recipe_type: snack
  cook_minutes: null
  prep_minutes: null
  sweet: false
  variant_of: null
  veg_type: vegetarian
  instructions: 'den Quirlen des Mixers 8 Minuten sehr cremig ruehren. Eier einzeln
    je Â½

    Minute gut unterruehren. Mehl, Speisestaerke und Backpulver sieben. Mit

    Milch und 8 El Zitronensaft abwechselnd unterruehren.

    Den Teig in eine gefettete, mit Mehl ausgestaeubte Gugelhupfform streichen.

    Im vorgeheizten Ofen bei 175 Â°C (Umluft 150 Â°C) auf der 2. Schiene von

    unten 40 bis 45 Minuten backen.

    Den Kuchen 5 Minuten ruhen lassen, dann aus der Form stuerzen. Sofort

    mehrfach einstechen mit je 3 EL Zitronensaft und Orangensaft betraeufeln.

    Abkuehlen lassen. Zum Schluss mit dem Guss aus Puderzucker und Zitronensaft

    betraeufeln und mit Liebesperlen garnieren.'
- recipe_id: 270
  name: Tims Saurer
  recipe_type: main_dish
  cook_minutes: null
  prep_minutes: null
  sweet: false
  variant_of: null
  veg_type: vegan
  instructions: 'Alle Zutaten mischen, in eine Flasche fuellen und in den Froster
