    Haelfte der heissen Gemuesebruehe abloeschen. Das Risotto bei mittlerer

    Hitze unter ruehren so lange koecheln lassen, bis die Fluessigkeit fast

    verschwunden ist. Restliche Fluessigkeit zugeben und wie oben beschrieben

    wieder holen. Sobald die Fluessigkeit aufgesogen ist, vom Herd nehmen. Den

    geriebenen Parmesan und Kerbel unterheben. Mit Salz und der Butter

    abschmecken. Eventuell mit Kerbel streuen und servieren.'
