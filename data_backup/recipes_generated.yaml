    Spargelschaumsuppe mit Fruehlingskraeutern und Lachstatar


    Suppe:

    400 g geschaelter weisser Spargel

    1 EL Butter

    200 ml Sahne

    1 EL gehackter Kerbel

    1 EL glatte Petersilie

    1 EL fein geschnittener Baerlauch

    1 EL fein geschnittener Sauerampfer

    1 EL fein geschnittener Schnittlauch

    Zucker / Salz / Pfeffer

    Tartar:

    200 g Lachsfilet ohne Haut

    1 Schalotte

    Zitronensaft

    Salz/Pfeffer

    Olivenoel

    1 EL fein geschnittener Schnittlauch

    1 EL kalte Butter


    Den Spargel in kleine Stuecke schneiden und in einem Topf in 1 EL Butter

    anschwitzen. 800 ml Wasser zugeben und den Spargel weich kochen. Die

    Kraeuter zugeben, das Ganze mit einem Mixstab glatt puerieren und durch ein

    feines Sieb passieren. Die Spargel-Kraeuter Suppe zusammen mit der Sahne

    zurueck in den Topf geben und einmal aufkochen. Mit einer Prise Zucker,

    Salz und Pfeffer wuerzen.

    Das Lachsfilet und die Schalotte sehr fein wuerfeln. Beides in eine

    Schuessel geben und mit etwas Zitronensaft, Salz und Pfeffer abschmecken.

    Mit Olivenoel und Schnittlauch marinieren. Das Lachstartar mittig auf

    Suppentellern anrichten.

    Die Butter mit dem Mixstab unter die Suppe schlagen, bis diese schoen

    schaeumt. Die Suppe in die Teller giessen und etwas Schaum darueber

    loeffeln.'
