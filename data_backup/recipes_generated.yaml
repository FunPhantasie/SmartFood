- recipe_id: 234
  name: Gefuellter Kuerbis
  recipe_type: main_dish
  cook_minutes: null
  prep_minutes: null
  sweet: false
  variant_of: null
  veg_type: vegetarian
  instructions: 'Vom Kuerbis einen Deckeln von 18 â€“ 20 cm Durchmesser abschneiden.
    Aus dem

    Unterteil alle Kerne und harten Fasern herauskratzen. Die Innenwaende mit

    Sojasauce betraeufeln und mit Salz und Pfeffer ausstreuen. Den Kuerbis zur

    Seite stellen, damit das Fruchtfleisch marinieren kann.

    In der Zwischenzeit die Fuellung herstellen. Die Zwiebeln pellen und in

    kleine Wuerfel schneiden, die Fruehlingszwiebeln ebenfalls (das Gruen

    mitverwenden), Moehren schaben und auch klein schneiden.

    Alles zusammen in einem Topf mit der Butter anschmoren. Die

    Sonnenblumenkerne und Kernige Haferflocken dazugeben. Alles gut vermengen.

    Die Knoblauchzehe pressen und zusammen mit der heissen Bruehe ueber die

    Gemuesemasse geben. Vom Herd nehmen und gut verruehren, so dass eine

    Fuellmasse entsteht. Diese in den marinierten Kuerbis geben.

    Den abgeschnittenen Deckel wieder genau einpassen und den Kuerbis in eine

    flache, feuerfeste Form oder auf die Saftpfanne setzen. Im Backofen bei

    220Â° C gut 1 Stunde backen, bis die Kuerbisschale Blasen wirft. Ab und zu

    etwas Wasser in die Form giessen. Sehr heiss servieren, die Fuellung

    portionsweisse herausschoepfen und dabei immer etwas weiches Kuerbisfleisch

    mit abloesen.

    Tipp: Statt Sojasauce kann der Kuerbis auch mit Worcestersauce mariniert

    werden. Die Fruehlingszwiebeln koennen gut durch Lauch ersetzt werden.'
