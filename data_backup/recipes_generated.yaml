  veg_type: vegetarian
  instructions: 'Kuerbisfleisch grob wuerfeln. Fruehlingszwiebeln in  Ringe schneiden
    und in

    OEl glasig duensten. Die Kuerbiswuerfel zugeben und weitere 3 Minuten

    anbraten. Die Haelfte des Majorans zugeben und mit Gemuesebruehe

