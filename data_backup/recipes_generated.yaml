- recipe_id: 6
  name: Fetacreme mit Paprika und Kraeutern ( ( (
  recipe_type: main_dish
  cook_minutes: null
  prep_minutes: null
  sweet: false
  variant_of: null
  veg_type: vegetarian
  instructions: 'Paprikaschote und Fetakaese fein wuerfeln. Zusammen mit dem Frischkaese
    und

    dem Olivenoel mit dem Puerierstab zu einer cremigen Masse verruehren.

    Gepresste Knoblauchzehen und Kraeuter hinzugeben und mit Salz und Pfeffer

    abschmecken. Kalt stellen!


    Fonduesaucen fuer Fleischfondue


    Orangen-Birnen-Sauce

    2 Orangen

    2 Birnen

    2 EL Zitronensaft

    1 TL Curry

    200 g Frischkaese

    Salz, schwarzer Pfeffer


    Orangenheiss abwaschen und abtrocknen. Schale fein abreiben und den Saft

    auspressen. Birnen schaelen, entkernen und fein raspeln. Die geraspelten

    Birnenstuecke, abgeriebene Orangenschalen und den Orangensaft mit den

    restlichen Zutaten vermengen. Abschmecken mit Salz und Pfeffer.


    Feurige Honig-Sauce

    300 g Tomatenketchup

    3 EL Honig

    2 Knoblauchzehen

    1 rote Chilisauce

    1 EL Kraeuter der Provence

    Salz, Pfeffer


    Ketchup und Honig verruehren. Knoblauch und Chilischote sehr fein hacken

    und zusammen mit den Kraeutern der Provence unterruehren. Mit Salz und

    Pfeffer abschmecken.


    Erdnuss-Sauce

    1 Knoblauchzehe

    20 g frischer Ingwer

    1 rote Chilischote

    4 EL Erdnussbutter

    200 ml ungesuesste Kokosmilch

    200 ml Huehnerbruehe

    2 EL Sojasauce


    Knoblauch und Ingwer schaelen, zusammen mit der Chilischote fein hacken. In

    heissem OEl 2 Minuten anschwitzen. Erdnussbutter zugeben und unter Ruehren

    schmelzen. Mit Kokosmilch und Huehnerbruehe abloeschen und bei kleiner

    Hitze 5 Minuten kochen. Mit Sojasauce wuerzen und lauwarm servieren. Die

    Sauce wird dickfluessiger sobald sie abkuehlt.'
