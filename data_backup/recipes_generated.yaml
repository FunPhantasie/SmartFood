  veg_type: meat
  instructions: 'Fuer das Pueree Kartoffeln und gross gewuerfelten Kuerbis in Salzwasser

    garen und abgiessen. Mit Milch und Margarine zerstampfen und mit Salz,

    Pfeffer, Muskatnuss und Ingwer abschmecken.

    Fuer das Mangohuhn Haehnchenbrust in erhitzen OEl anbraten, herausnehmen,

    mit Salz und Currypulver betreuen und warm stellen. Schalotte wuerfeln,

    anduensten, mit Bruehe und Wein abloeschen und kurz duensten, Mango in

    Spalten schneiden, mit Haehnchenbrust zufuegen und koecheln lassen.

    Mangohuhn mit Kuerbis-Kartoffelnpueree und mit Petersilie bestreut

    servieren.'
- recipe_id: 246
  name: Pumpkin-Pancake
  recipe_type: main_dish
  cook_minutes: null
  prep_minutes: null
  sweet: false
  variant_of: null
  veg_type: meat
  instructions: 'Mehl, Zucker, Backpulver, Salz und Zimt mischen. Eier trennen.

    Kuerbisfleisch in Wuerfel schneiden und puerieren. Eigelb und Margarine

