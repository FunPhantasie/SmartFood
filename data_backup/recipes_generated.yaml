    auf den Pfannkuchen verteilen. Dann die Pfannkuchen in Klarsichtfolie

    aufrollen, auswickeln und in Scheiben schneiden.


    Rotbarben, Teriyaki Spinat und Klebreisbaellchen'
- recipe_id: 306
  name: Rotbarben asiatisch geschmort
  recipe_type: main_dish
  cook_minutes: null
  prep_minutes: null
  sweet: false
  variant_of: null
  veg_type: vegetarian
  instructions: 'Zitronengras laengs halbieren bzw. plattieren und im Ganzen mit dazugeben.

    Ingwer schaelen und in feine Streifen schneiden. Moehren schaelen und

