    Eiskalt servieren,.


    Papaya-Steak-Salat, Erbsensuppe mit Minze und Roti mit Chili-Gewuerzoel'
- recipe_id: 271
  name: Papaya-Steak-Salat
  recipe_type: snack
  cook_minutes: null
  prep_minutes: null
  sweet: false
  variant_of: null
  veg_type: vegetarian
  instructions: 'Tomatenmark, 1 Schuss Wasser, Zitronensaft, Zucker, Salz, Pfeffer,

    Weissweinessig und 10 EL OEl glatt verruehren. Chicoree putzen und in

    Streifen schneiden und auf einen Teller geben.

    Papayas schaelen, halbieren und die Kerne entfernen. Das Fruchtfleisch in

    Streifen schneiden. Avocados von der Haut loesen, den Stein entfernen und

    in  feine Streifen schneiden.

    Die Avocadostreifen auf den Salat geben und mit der Vinaigrette

    betraeufeln.

    Rumsteaks mit dem Paprikapulver und Salz einreiben und in zwei Pfannen in

    jeweils 2 EL OEl von jeder Seite 3 bis 4 Min. anbraten. Aus der Pfanne

    nehmen, schneiden und ueber den Salat verteilen. Ein Teil des

    Tomatendressings ueber den Salat geben, restliches Dressing dazureichen.'
- recipe_id: 272
  name: Erbsensuppe mit Minze
  recipe_type: main_dish
  cook_minutes: null
  prep_minutes: null
  sweet: false
  variant_of: null
  veg_type: vegetarian
  instructions: 'Die Gemuesezwiebel putzen und in feine Scheiben schneiden. Den Knoblauch

    fein hacken. Das OEl in einem Topf erhitzen, Zwiebeln und Knoblauch darin

    bei mittlerer Hitze glasig duensten. Mit Pernod abloeschen, den Gemuesefond

    und Weisswein angiessen und alles bei mittlerer Hitze 20 Minuten kochen

    lassen. Anschliessend 200 ml Sahne dazugeben. Kurz aufkochen und dann die

    Erbsen dazugeben. Die Minze erst kurz vor dem puerieren rupfen und in den

    Topf geben, damit die aetherischen OEle erhalten bleiben. Wer moechte, kann

    ein bisschen Minze zur Dekoration uebrig lassen Dann alles mit dem

    Kuechenmixer puerieren. Das Eigelb und die restliche Sahne vermengen und in

    die Suppe ruehren. Nicht mehr kochen. Zum Schluss mit Salz und Pfeffer

    abschmecken.'
- recipe_id: 273
  name: Roti mit Chili-Gewuerzoel
  recipe_type: main_dish
  cook_minutes: null
  prep_minutes: null
  sweet: false
  variant_of: null
  veg_type: vegetarian
  instructions: 'Alle trockenen Gewuerze in einer Pfanne 1 Minute bei hoher Temperatur

    anschwitzen, wieder herausnehmen und im Moerser zerkleinern. Die

    Chilischote fein schneiden und dazugeben. Die Petersilie und den Koriander

    hacken und mit den Gewuerzen und dem OEl vermengen.

    Die Fladenbrote mit dem OEl einstreichen und uebereinander stapeln. Dann in

    einem feuchten Tuch einschlagen und im mittelheissen Backofen erhitzen.


    Schwarze Rettichsuppe, Minuten-Steak-Toast mit Orangen â€“ Chili - Dip'
- recipe_id: 274
  name: schwarze Rettichsuppe
  recipe_type: main_dish
  cook_minutes: null
  prep_minutes: null
  sweet: false
  variant_of: null
  veg_type: vegetarian
  instructions: 'Die Zwiebel und den Knoblauch pellen und fein wuerfeln. Die Kartoffel

    schaelen und wuerfeln. Olivenoel oder Butter in einem Topf erhitzen.

    Zwiebeln und Knoblauch darin glasig anschwitzen, die Kartoffelwuerfel

    dazugeben und eine weitere Minute anschwitzen. Mit dem Weisswein abloeschen

    und vollstaendig einkochen lassen. Mit Fond angiessen und dann bei

    mittlerer Hitze 25 Minuten sanft kochen. Die Suppe salzen und pfeffern. Den

    Rettich waschen und schaelen, in feine Scheiben hobeln und einige zur

    Dekoration zur Seite stellen, die restlichen zur Suppe geben. Die Suppe mit

    dem Rettich fein puerieren, in einen zweiten Topf geben, Sahne dazugeben

    und aufkochen. Zum Schluss mit Salz und Pfeffer wuerzen und mit dem

    Schnittlauch bestreut servieren.'
- recipe_id: 275
  name: Minuten-Steak-Toast mit Brunnenkresse und Mozzarella
  recipe_type: main_dish
  cook_minutes: null
  prep_minutes: null
  sweet: false
  variant_of: null
  veg_type: meat
  instructions: 'Die Ciabattabrote laengs halbieren. Mit 2 EL OEl einstreichen und
    im Ofen

    knusprig roesten. Die Brunnenkresse waschen, trocken schleudern und grob

    zerschneiden. Den Mozzarella in Scheiben schneiden. Paprikapulver, Pfeffer

    und Salz mischen, die Steaks  damit wuerzen und in erhitztem OEl sehr heiss

    anbraten. Jeweils eine Haelfte der beiden Brote mit Mozzarella und

    Brunnenkresse belegen. Dann vier der kleinen Steaks drauflegen und

    grosszuegig mit dem Orangen - Dip betraeufeln. Die zweite Brothaelften

    auflegen und sofort servieren. Den restlichen Dip dazu servieren.'
- recipe_id: 276
  name: Orangen â€“ Chili - Dip
  recipe_type: snack
  cook_minutes: null
  prep_minutes: null
  sweet: false
  variant_of: null
  veg_type: meat
  instructions: 'Die Chili-Schote halbieren und entkernen. Dann zusammen mit dem Honig,
    den

    Mandeln und dem Koriander sehr fein hacken. Das Fruchtfleisch der Orange

    wuerfeln.

    Alles mit der Chilisosse, dem Orangenabrieb und dem Zitronensaft

    verruehren. Zum Schluss mit Salz und Pfeffer abschmecken.


    Wildfrikadelle mit schneller Gurkenpfanne und winterlichem Salat'
- recipe_id: 277
  name: Wildfrikadelle
  recipe_type: main_dish
  cook_minutes: null
  prep_minutes: null
  sweet: false
  variant_of: null
  veg_type: meat
  instructions: 'Das Fleisch durch den Fleischwolf drehen. Toast mit Milch betraeufeln.
    Die

    Gemuesezwiebel schaelen, wuerfeln und mit zum Hack geben. Dann das Fleisch

    mit Cayenne, Ingwer und Senf wuerzen. Rosmarinnadeln hacken und auch

    dazugeben. Eier, Salz und Pfeffer mit der Fleischmasse vermengen. Das

    Toastbrot ausdruecken und mit in die Masse verarbeiten. Die Masse zu

    Frikadellen formen und in nicht zu heissem Olivenoel braten.'
- recipe_id: 278
  name: Schnelle Gurkenpfanne
  recipe_type: main_dish
  cook_minutes: null
  prep_minutes: null
  sweet: false
  variant_of: null
  veg_type: meat
  instructions: 'Die Salatgurken schaelen., laengs halbieren, entkernen und in 2 cm
    breite

    Stuecke schneiden. Zwiebeln und Knoblauch pellen und in feine Scheiben

    schneiden.

    Die Butter in einem Topf aufschaeumen lassen, Zwiebeln und Knoblauch

    anschwitzen, die Gurken dazugeben und 2 Minuten duensten. Mit Salz, Zucker

    und Pfeffer wuerzen. Weisswein angiessen, die Bruehe hinzufuegen und

    einkochen lassen. Dann die Sahne in die Pfanne geben.

    Die Gurken aufkochen und bei mittlerer Hitze 3 bis 4 Minuten kochen lassen.

    Den Schinken in feine Streifen schneiden und mit dem Dill zu den Gurken

    geben.

    Zusammen mit Salzkartoffeln servieren.'
- recipe_id: 279
  name: Winterlicher Salat
  recipe_type: snack
  cook_minutes: null
  prep_minutes: null
  sweet: false
  variant_of: null
  veg_type: vegan
  instructions: 'Den Feldsalat putzen, waschen und trocken schleudern. Chicoree und

    Radicchio in Blaetter zerteilen. Die Blaetter von der bitteren Mitte

    befreien. Den Granatapfel vierteln, die Kerne herausloesen und locker ueber

    dem Salat verteilen. Limettenschale mit dem Limettensaft, Honig,

    Cayennepfeffer, Zimt, Senf, Salz, Zucker und Olivenoel in ein Glas mit

    einem Schraubverschluss geben, dieses verschliessen und kraeftig

    schuetteln. Den Salat auf einer Platte anrichten, die Granatapfelkerne

    darueber locker verteilen und mit dem Dressing uebergiessen.


    Rinderfilet nach Tafelspitz-Art, Apfelkren und Schokomalheur'
- recipe_id: 280
  name: Rinderfilet nach Tafelspitz-Art
  recipe_type: main_dish
  cook_minutes: null
  prep_minutes: null
  sweet: false
  variant_of: null
  veg_type: meat
  instructions: 'Bruehe und Weisswein in einem kleinen Braeter oder Topf aufkochen.
    Das

    Gemuese putzen und in feine Scheiben (paysanne) schneiden. Mit in die

    Bruehe geben. Das Rinderfilet salzen, pfeffern und darauf setzen.

    Anschliessend zugedeckt im Ofen bei 200 Â°C 20 bis 25 Minuten garen, dabei

    das Fleisch einmal wenden. Inzwischen das Brot entrinden und grob

    stueckeln. Am Ende der Garzeit das Fleisch herausnehmen und in Alufolie

    gewickelt warm halten. Die Sosse durch ein Sieb geben und erneut aufkochen,

    die Schlagsahne und das Brot unterruehren. Mit einem Mixstab glatt

    puerieren. Mit einer Prise Muskatnuss, Salz und Pfeffer wuerzen. Das Filet

    mit der Sosse und mit Schnittlauch bestreut servieren. Dazu passen

    Salzkartoffeln.'
- recipe_id: 281
  name: Apfelkren
  recipe_type: main_dish
  cook_minutes: null
  prep_minutes: null
  sweet: false
  variant_of: null
  veg_type: vegan
  instructions: 'Die AEpfel vierteln, schaelen, entkernen und in grobe Stuecke schneiden.

    Dann mit dem Zitronensaft, Zucker, einer Prise Salz und 1 EL Wasser in

    einen Topf geben, bei niedriger Hitze unter Ruehren zum Kochen bringen und

    verschlossen duensten, bis die AEpfel zerfallen, dabei oefter umruehren.

    Anschliessend die AEpfel vollstaendig auskuehlen lassen. Kurz vor dem

    Servieren den Meerrettich schaelen und fein reiben. Unter das Apfelkompott

    heben, erneut mit Salz und Pfeffer wuerzen. Schnittlauch in feine Roellchen

    schneiden und ueber den Apfelkren streuen.

    Alternative:

    75 g Meerrettich schaelen, fein reiben und mit 1 EL Zitronensaft in einer

    Schuessel mischen. 2 AEpfel schaelen, auf der Kastenreibe raffeln und mit

    dem Meerrettich mischen. Alles mit Salz und Pfeffer wuerzen und sofort

    servieren.


    Schokomalheur


    Butter und Zucker fuer die Foermchen

    130 g Zartbitterschokolade (mind. 60 % Kakao)

    130 g Butter

    4 Eier (Kl. M)

    190 g Zucker

    2 Paeckchen Vanillezucker

    1 Prise Salz

    2 EL Rum

    50 g Mehl

    50 g gem. Haselnuesse

    6 Schokoladenbonbon mit Karamellfuellung

    1-2 TL Puderzucker


    Schokolade hacken und mit der Butter ueber einem heissen Wasserbad

    zerlassen. Eier, Zucker, Vanillezucker und Salz mit den Quirlen des

    Handruehrers mindestens 5 Minuten sehr cremig ruehren. Mehl, Nuesse und Rum

    unter die Schokoladenmischung heben. 6 ofenfeste Tassen oder Foermchen (a

    150 ml Inhalt) fetten, mit Zucker ausstreuen und die Masse in die Foermchen

    verteilen. Je 1 Bonbon in die Mitte der Foermchen druecken und auf ein

    Blech stellen. Die Foermchen im vorgeheizten Ofen bei 200 Â°C auf der 2.

    Schiene von unten 12 Minuten backen (Umluft nicht geeignet). Toertchen aus

    den Foermchen stuerzen. Mit Puderzucker bestaeubt servieren. Dazu passt

    Eis.


    Wolfsbarsch-Rollmops, Fischfrikadellen und Shrimps - Cocktail'
- recipe_id: 282
  name: Wolfsbarsch-Rollmops
  recipe_type: main_dish
  cook_minutes: null
  prep_minutes: null
  sweet: false
  variant_of: null
  veg_type: meat
  instructions: 'Die Zwiebeln in feine Scheiben schneiden. Mit dem Essig, Wasser,
    Zucker und

    Salz in einen Topf geben und zum Kochen bringen. Dann in einem Moerser

    Piment- und Pfefferkoerner grob zerstossen und hinzugeben. Die Fischfilets

    entgraeten und mit der Haut nach unten auf die Arbeitsflaeche legen.

    Inzwischen die Gurken laengs vierteln. Je eine Gurkenspalte auf die

    Wolfsbarschfilets legen. Die Filets aufrollen und mit Zahnstochern fest

    machen. Rollmoepse in eine flache Schale dicht an dicht legen und mit der

    kochenden Marinade uebergiessen. UEber nacht im Kuehlschrank in der

    Marinade ziehen lassen.'
- recipe_id: 283
  name: Fischfrikadellen
  recipe_type: main_dish
  cook_minutes: null
  prep_minutes: null
  sweet: false
  variant_of: null
  veg_type: meat
  instructions: 'Graeten aus dem Seelachsfilet entfernen. Filet wuerfeln. Estragonblaetter

    zupfen. Fisch, Estragon, gepellten Knoblauch und Zitronensaft in ein hohes

    Gefaess geben und mit dem Schneidstab puerieren. Surimi klein wuerfeln und

    mit Semmelbroesel, Eiern, Mayonnaise und dem Fisch verkneten. Mit Salz und

    Pfeffer wuerzen. Aus der Fischmasse 8 Kuechlein formen. Polenta in einen

    tiefen Teller geben und die Kuechlein darin wenden. OEl in einer Pfanne

    erhitzen und die Frikadellen darin von jeder Seite 4 bis 5 Minuten braten.

    Auf Kuechenkrepp abtropfen lassen.

    Joghurt, Salatcreme, scharfen Senf und Zitronensaft verruehren. Dann mit

    Salz und Pfeffer abschmecken und zu den Fischpflanzerln servieren.'
- recipe_id: 284
  name: Shrimps - Cocktail
  recipe_type: main_dish
  cook_minutes: null
  prep_minutes: null
  sweet: false
  variant_of: null
  veg_type: vegetarian
  instructions: 'Mayonnaise, Ketchup, Zitronensaft, Meerrettich, Worcestershire-Sosse
    und

    Cognac verruehren. Mit Salz, Pfeffer und Tabascososse wuerzen. Den Strunk

    und die aeusseren Blaetter vom Eisbergsalat entfernen, den Salat in feine

    Streifen schneiden und in Glaeser geben. Dann den Dill zupfen und fein

    schneiden. Einige Zweige als Dekoration uebriglassen. Die Nordmeershrimps

    abgiessen und gut abtropfen lassen, mit dem Dill und etwas Pfeffer

    vermischen und auf dem Salat verteilen. Die Sosse darueber geben und zum

    Schluss mit Dill und Zitronenscheiben garniert servieren.


    Minutenroastbeef und Ricotta â€“ Spinat - Gnocchi mit Steinpilzrahm'
- recipe_id: 285
  name: Minutenroastbeef
  recipe_type: main_dish
  cook_minutes: null
  prep_minutes: null
  sweet: false
  variant_of: null
  veg_type: vegetarian
  instructions: 'Den Ofen mit Unterhitze auf 250 Â°C vorheizen (Umluft nicht empfehlenswert).

    Eventuell Sehnen und Fett vom Fleisch entfernen. 2 EL OEl in einer Pfanne

    erhitzen und das Fleisch darin rundherum sehr scharf anbraten. Die Tomaten

    dazugeben und ebenfalls kraeftig anbraten. Das Fleisch aus der Pfanne

    nehmen, 5 Minuten ruhen lassen und dann in Scheiben schneiden. Auf eine

    ofenfeste Platte legen. Die Rosmarinnadeln von den Zweigen zupfen und mit 4

    EL Olivenoel und 2 EL Zitronensaft puerieren. Das Fleisch mit dem

    Rosmarinoel betraeufeln und mit Meersalz bestreuen. Die Tomaten rundherum

    legen. Im Ofen 7 bis 8 Minuten auf der untersten schiene erhitzen.

    Rauke waschen, trocken schleudern und mit dem restlichen OEl und

    Zitronensaft betraeufeln, salzen und pfeffern. Das Roastbeef mit der Rauke

    bestreut servieren.'
- recipe_id: 286
  name: Ricotta â€“ Spinat - Gnocchi mit Steinpilzrahm (Malfatti)
  recipe_type: main_dish
  cook_minutes: null
  prep_minutes: null
  sweet: false
  variant_of: null
  veg_type: vegetarian
  instructions: 'Die Steinpilze in 125 ml warmem Wasser einweichen. Den Ricotta in
    eine

    Schuessel geben. Salzen und pfeffern. Mit Ei, Parmesan, Mehl und

    Semmelbroeseln mischen, mit Muskatnuss wuerzen und kurz quellen lassen.

    Inzwischen den Spinat putzen, gruendlich waschen und in kochendem

    Salzwasser 1 Minute blanchieren. Abgiessen, abschrecken und gut

    ausdruecken. Anschliessend den Spinat hacken und zur Ricottamischung geben.

    Die Masse zu kleinen Kugeln formen und in einen Topf kochendes Salzwasser

    geben. Hitze reduzieren und die Knoedel darin knapp unter dem Siedepunkt

    etwa 12 Minuten ziehen lassen. Inzwischen die Schalotten pellen und fein

    wuerfeln. In heissem OEl 1 Minute farblos anschwitzen. Die Steinpilze

    ausdruecken und klein hacken, dazugeben und eine weiter Minute anschwitzen.

    Das Einweichwasser durch ein Sieb in einen Topf geben. Einkochen lassen und

    dann mit dem Portwein abloeschen. Die Sahne angiessen und cremig einkochen

    lassen, mit Salz und Pfeffer. Die Knoedel aus dem Wasser nehmen, abtropfen

    lassen und mit der Sosse servieren.


    Spinat â€“ Ricotta mit Paprika-Sosse und Nutella - Charlotte'
- recipe_id: 287
  name: Spinat - Ricotta Vol-au-vents und Liaison mit Paprika-Sosse
  recipe_type: main_dish
  cook_minutes: null
  prep_minutes: null
  sweet: false
  variant_of: null
  veg_type: vegetarian
  instructions: 'Den Spinat putzen, waschen und trocken schleudern. Die Schalotten
    pellen

    und fein wuerfeln. In einem flachen Topf in dem Olivenoel anschwitzen, den

    Spinat grob hacken, dazugeben und unter ruehren bei mittlerer Hitze 4

    Minuten duensten. In ein Sieb geben und abtropfen lassen.

    Sahne steif schlagen. 2 Eier trennen, Eigelbe mit der Sahne verruehren und

    kalt stellen. Ricotta in einer Schuessel mit dem Parmesan, Salz, Pfeffer

    und Muskat verruehren. Das verbliebene Ei in die Ricottamasse geben und den

    Spinat untermischen. Die Eiweisse mit einer Prise salz steif schlagen und

    ebenfalls unterheben. Die Masse in die Pastetchen fuellen. Im vorgeheizten

    Backofen bei

    200 Â°C auf der untersten Schiene 15 Minuten backen. 2 Minuten vor Ende der

    Garzeit die Ei-Sahne auf die Pastetchen geben und bei Oberhitze

    ueberbacken, bis sie hellbraun sind.'
- recipe_id: 288
  name: Paprika-Sosse
  recipe_type: main_dish
  cook_minutes: null
  prep_minutes: null
  sweet: false
  variant_of: null
  veg_type: vegan
  instructions: 'Den Sternanis zusammen mit dem gehackten Knoblauch und dem Zucker
    in einer

    Pfanne karamellisieren lassen. Mit dem Saft der Limetten abloeschen. Die

    abgetropfte und grob gehackte Paprika dazugeben und mit der Gemuesebruehe

    auffuellen. Mit Salz und Pfeffer abschmecken. Den Sternanis herausnehmen,

    die Sosse fein puerieren, auf einer Platte anrichten und die Pasteten

    darauf servieren.'
- recipe_id: 289
  name: Nutella - Charlotte
  recipe_type: main_dish
  cook_minutes: null
  prep_minutes: null
  sweet: false
  variant_of: null
  veg_type: vegetarian
  instructions: 'Sahne und Nougatcreme unter ruehren in einem Topf erwaermen, bis
    sich die

    Nougatcreme vollstaendig in der Sahne aufgeloest hat. Vom Herd nehmen und

    mindestens 3 Stunden kalt stellen. 1 EL kandierten Ingwer fein hacken. Die

    komplett durchgekuehlte Nussnougatsahne mit den Quirlen des Handruehrers

    steif schlagen und die Ingwerwuerfelchen unterheben. In einer Form

    abwechselnd Waffelroellchen und Mousse uebereinander schichten. Die

    Charlotte mit Kakao abstaeuben und mit dem restlichen, in Streifen

    geschnittenen Ingwer garnieren. Zum Schluss mit den Waffelroellchen

    dekorieren.


    Linsenbolognese, Apfel in Mandelteig, Ziegenkaese Crostini'
- recipe_id: 290
  name: Linsenbolognese
  recipe_type: main_dish
  cook_minutes: null
  prep_minutes: null
  sweet: false
  variant_of: null
  veg_type: meat
  instructions: 'Suppengruen putzen, waschen und ca. Â½ cm gross wuerfeln. Zwiebeln
    fein

    wuerfeln. Alles in heissem Olivenoel anduensten. Kraeftig mit Salz, Pfeffer

    und etwas Zucker wuerzen. Paprika- und Tomatenmark und Oregano kurz

    mitroesten. Mit Rotwein und Bruehe aufgiessen, Linsen zugeben. Aufkochen,

    zugedeckt  bei mittlerer Hitze 20 bis 25 Minuten garen. Dabei ab und zu

    umruehren. Bandnudeln in kochendem Salzwasser nach Packungsanweisung garen.

    Sosse eventuell nachwuerzen, Nudeln abgiessen, unter die Sosse mischen und

    mit dem Parmesan und der Petersilie bestreut servieren.

    Tipp: Statt der Beluga-Linsen koennen Sie auch rote  Linsen verwenden, die

    zerkochen jedoch etwas staerker.'
- recipe_id: 291
  name: Apfel in Mandelteig gebacken
  recipe_type: main_dish
  cook_minutes: null
  prep_minutes: null
  sweet: false
  variant_of: null
  veg_type: vegetarian
  instructions: 'Die Vanilleschote laengs halbieren und das Mark herauskratzen. Butter,

    Zucker, Vanillemark und eine Prise Salz mit den Quirlen des

    Handruehrgeraetes oder in der Kuechenmaschine schaumig schlagen. Die Eier

    nacheinander gruendlich unterruehren. Mehl und gemahlene Mandeln

    sorgfaeltig unterheben. Die Masse in 6 gefettete ofenfeste Foermchen (12

    cm) geben und glatt streichen. Die AEpfel schaelen halbieren und entkernen.

    Die AEpfel mit einem scharfen Messer tief einritzen aber nicht

    durchschneiden. Mit dem Zitronensaft einreiben und mit der runden Seite

    nach oben in die Mandelmasse setzen. Mit dem braunen Zucker bestreuen.

    Im vorgeheizten Backofen bei 180 Â°C (Umluft 155 Â°C, Gas Stufe 2-3) 20 bis

    25 Minuten abbacken. Heiss mit etwas Puderzucker bestreut servieren.'
- recipe_id: 292
  name: Ziegenkaese Crostini
  recipe_type: main_dish
  cook_minutes: null
  prep_minutes: null
  sweet: false
  variant_of: null
  veg_type: vegetarian
  instructions: 'Das Brot in schraege Scheiben schneiden. 4 EL OEl in einer Pfanne
    erhitzen

    und die Brotscheiben auf beiden Seiten goldbraun roesten. Die Tomaten

    waschen und in Scheiben schneiden. In eine Schuessel geben und mit dem

    restlichen Olivenoel, Zitronenschale, Salz, Pfeffer und etwas Zucker

    mischen. Die Crostini grosszuegig mit dem Kaese bestreichen. Auf eine

    Platte legen, den Tomatensalat darauf geben und den Meerrettich frisch

    darueber reiben.


    Tims Wellington, lauwarmer Lachs und einfacher Blattsalat'
- recipe_id: 293
  name: Tims Wellington
  recipe_type: main_dish
  cook_minutes: null
  prep_minutes: null
  sweet: false
  variant_of: null
  veg_type: meat
  instructions: 'Fleisch von Sehnen und Fett befreien. Schalotten und Knoblauch pellen,
    aber

    nicht hacken. Champignons putzen und vierteln. Rinderfilet salzen und

    pfeffern. 2 EL OEl in einer Pfanne erhitzen und das Filet von allen Seiten

    kraeftig anbraten. Herausnehmen und in eine ofenfeste Form legen. Die

    Schalotten, Knoblauch und Champignons zusammen unter ruehren im restlichen

    heissen OEl 3 â€“ 4 Minuten braten. Rosmarinnadeln abzupfen, hacken und mit

    dem Honig dazugeben. Mit dem Rotwein abloeschen, aufkochen lassen. Filet

    mit dem Senf einstreichen. Die Pilzmasse zum Fleisch in die Form geben.

    Eigelbe verquirlen und den Rand der Form bestreichen. Blaetterteig-Blaetter

    aufeinander legen und mit den Nudelholz knapp groesser als die Masse der

    Form ausrollen. Den Teig ueber die Form legen und rundherum fest

    andruecken. Teig mit dem restlichen Eigelb einstreichen. Kleine Loecher mit

    einem Messer in den Teig stechen. Im vorgeheizten Ofen bei 200 Â°C (Umluft

    180 Â°C, Bas Stufe 3 â€“ 4) auf der zweiten Schiene von unten ca. 20 bis 25

    Minuten backen.'
- recipe_id: 294
  name: Lauwarmer Lachs
  recipe_type: main_dish
  cook_minutes: null
  prep_minutes: null
  sweet: false
  variant_of: null
  veg_type: meat
  instructions: 'Tomaten kreuzweise einritzen und den Stielansatz entfernen. In kochendes

    Salzwasser geben, 20 Sekunden kochen, kalt abschrecken und haeuten. Die

    Tomaten vierteln und fein wuerfeln. Zitronensaft, Olivenoel, Sojasosse und

    Tomatenwuerfel verruehren und mit Salz und Pfeffer wuerzen. Lachsfilet mit

    einem scharfen Messer in feine Scheiben schneiden. Eine Platte leicht mit

    Olivenoel bestreichen und die Lachsscheiben darauf verteilen. Den Lachs

    salzen und pfeffern, mit ein wenig Olivenoel betraeufeln und kurz unter dem

    vorgeheizten Grill eine Minute leicht erhitzen. Mit der Vinaigrette

    betraeufeln. Mit dem Schnittlauch bestreut servieren.'
- recipe_id: 295
  name: Einfacher Blattsalat
