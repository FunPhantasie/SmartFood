    glatt ruehren und Gulasch binden. UEbrige Zwiebelringe ca. 5 Miinuten vor

    Ende der Garzeit zum Gulasch geben.

    Petersilie waschen, trocken schuetteln, Blaettchen von den Stieflen zupfen

    und fein hacken. Butter in einer Pfanne schmelzen. Kartoffeln und

    Petersilie dazugeben, im Fett schwenken, Gulasch und Kartoffeln anrichten.'
- recipe_id: 173
  name: Bayerischer Krautbraten (Partygericht)
