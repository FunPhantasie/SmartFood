    nehmen. Backofengrill auf 200Â°C zuschalten, Pute von jeder Seite ca. 10

    Minuten knusprig braeumen.


    Den Bratenfond entfetten und mit Wasser auf 500 ml auffuellen.

    Putenfuellung und Gemuese zugeben, aufkochen, fein puerieren, mit Salz und

    Pfeffer abschmecken.


    Zwiebel, Rote Beete und AEpfel schaelen und wuerfeln, Ingwer schaelen und

    fein reichen. Zucker in einem Topf goldgelb karamellisieren, Butter zugeben

    und die Zwiebeln mit dem Ingwer darin kurz anduensten. Rote Bete,

    Gefluegelfond und Gewuerze zugeben und etwa 30 Minuten ohne Deckel gar

    kochen. Dabei immer wieder umruehren und bei Bedarf etwas Wasser zugeben.

    Die AEpfel zugeben, noch mal aufkochen und mit Aceto Balsamico, Salz und

    Pfeffer abschmecken.


    Tip: Zucker karamillisieren: Zucker trocken in einen Topf geben, bei

    mitttlerer Hitze langsam schmelzen und erst ruehren, wenn der Zucker fast

    fluessig ist. Wenn er goldgelb ist, die Butter zugeben. Dabei vorsichtig

    sein, die Mischung ist sehr heiss.'
- recipe_id: 166
