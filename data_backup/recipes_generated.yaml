    trocken tupfen. Salzen und pfeffern und in Reismehl wenden. Reismehl ist

    glutenfrei, ist also fuer Glutenallergiker geeignet, ansonsten kann man

    auch normales Mehl verwenden. 2 EL OEl in einem Braeter erhitzen und die

    Fische darin von jeder Seite 2 Minuten anbraten. Herausnehmen und die

    vorbereiteten Zutaten mit dem restlichen OEl in den Braeter geben. Bei

    mittlerer Hitze 3 Minuten unter ruehren anschwitzen und mit Salz und

    Pfeffer wuerzen. Mit dem Sherry abloeschen und aufkochen. Die Fische wieder

    auf das Gemuese geben und im vorgeheizten Ofen bei 200 Â°C (Umluft nicht

    geeignet) 25 Minuten auf der 2. Schiene von unten garen.'
