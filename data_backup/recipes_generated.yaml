- recipe_id: 187
  name: Mediterraner Schweinerueckenbraten mit Ofentomaten
  recipe_type: main_dish
  cook_minutes: null
  prep_minutes: null
  sweet: false
  variant_of: null
  veg_type: meat
  instructions: 'Den Backofen auf 100 Â°C vorheizen. Die Kraeuterblaettchen von den
    Stielen

    zupfen und grob hacken, Knoblauch schaelen und fein wuerfeln und den

    Parmesan reiben. Alles vermengen und mit dem Olivenoel zu einer Paste

    puerieren. Mit einem scharfen Messer von beiden Seiten eine Tasche in den

    Braten schneiden. Messer einmal oben und einmal unten ansetzen. Die Taschen

    aufklappen, gut mit Pfeffer und Salz wuerzen und mit der Paste bestreichen.

    Den Braten mit Kuechengarn in Form binden. Olivenoel in einer grossen

    Pfanne erhitzen, den Braten rundherum anbraten. Den Braten auf tiefes

    Backblech geben und im Backofen 3 Stunden sanft garen. Die Pfanne fuer die

    Sache weiterverwenden.

    Zwiebeln und Knoblauch schaelen, fein wuerfeln und in der Pfanne mit etwas

    Olivenoel anbraten. Sardelle fein hacken und mit den Tomaten zur Sauce

    geben. 10 Minuten kochen und mit Salz, Pfeffer und etwas Zucker

    abschmecken. Basilikum fein hacken und unterheben.

    Ingwer und Knoblauch schaelen und in feine Scheiben schneiden. Tomaten

    abspuelen und eine Stunde vor Ende der Garzeit auf das Backblech legen.

    Ingwer, Knoblauch und Kraeuter darauf verteilen und mit Olivenoel

    betraeufeln. Zusammen mit dem Braten garen.

    Den Braten in Scheiben schneiden und mit der Sauce und den Tomaten

    servieren. Dazu passen Roestkartoffeln.

    â‡¨ Sehr lecker ist dieser Braten auch, kalt in duenne Scheiben

    geschnitten als Aufschnitt!!!'
