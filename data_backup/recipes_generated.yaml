    Die Kraeuter dazugeben und kurz anschwitzen. Mit dem Weisswein abloeschen.

    Die Bruehe dazugeben, kurz aufkochen und die Keulen wieder in den Braeter

    setzen. Die Keulen in den vorgeheizten Ofen geben und bei 180 â€“ 200 Â° C 25

    Minuten garen. Dann 10 Minuten vor Ende der Garzeit die Oliven in den

