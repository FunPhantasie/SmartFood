  recipe_type: snack
  cook_minutes: null
  prep_minutes: null
  sweet: false
  variant_of: null
  veg_type: meat
  instructions: 'Die vorbereiteten Zutaten mit Ausnahme der Walnuesse mischen. Aus
    Miracel

    Whip Olive, Essig, Suessstoff, Salz, Pfeffer und dem Rote Beete Saft ein

    Dressing mixen, mit den Zutaten mischen. Den Salat ueber Nacht ziehen

    lassen. Vor dem Servieren abschmecken und die gehackten Walnuesse darauf

    verteilen.'
- recipe_id: 36
  name: Scampi-Kartoffelsalat
  recipe_type: snack
  cook_minutes: null
  prep_minutes: null
  sweet: false
  variant_of: null
  veg_type: vegetarian
  instructions: 'Kartoffeln unter fliessendem Wasser abbuersten und etwa 20 Minuten

    daempfen. Spargel waschen, holzige Enden abschneiden und schraeg in 3 cm

    lange Stuecke schneiden. In Salzwasser 5 bis 10 Minuten bissfest kochen.

    Tomaten mit heissem Wasser ueberbruehen, enthaeuten, vierteln, Kerne

    herausloesen. Tomatenfleisch wuerfeln. Kartoffeln pellen, halbieren oder

    vierteln. Zusammen mit abgetropftem Spargel, Tomatenwuerfeln und gehackten

    Eiern in eine Salatschuessel geben. OEl erhitzen. Scampi in der Schale

    braten und herausnehmen. Aus der Schale loesen. Darm am Ruecken entfernen

    und das Fleisch zum Salat geben. Schalotte schaelen, fein wuerfeln und im

    Scampi-OEl glasig duensten. Mit Essig abloeschen, mit Salz und Pfeffer

    wuerzen und warm ueber den Salat giessen. Alles 30 Minuten durchziehen

    lassen und vor dem Servieren nochmals abschmecken.

    Mit Dillzweigen garnieren.'
- recipe_id: 37
  name: Scharfer Nudelsalat (Partyrezept)
  recipe_type: snack
  cook_minutes: null
  prep_minutes: null
  sweet: false
  variant_of: null
  veg_type: vegan
  instructions: 'Nudeln in Salzwasser 8 Minuten garen. Fruehlinszwiebeln in feine
    ringe

    schneiden. Gemuesezwiebel fein hacken. Tomaten in kleine Wuerfel schneiden.

