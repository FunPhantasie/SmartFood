    ruehren und dazu servieren.'
- recipe_id: 304
  name: Russische Eier
  recipe_type: main_dish
  cook_minutes: null
  prep_minutes: null
  sweet: false
  variant_of: null
  veg_type: vegetarian
  instructions: 'Die Eier pieken, in kaltem Wasser aufsetzen. Wenn das Wasser kocht
    den Topf

    von der Flamme nehmen und die Eier  10 Min. ziehen lassen. Eier abgiessen

