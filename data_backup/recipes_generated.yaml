    anschliessend die Eier unterruehren. Mit Salz, Pfeffer und Muskatnuss

    wuerzen. Diese Masse gleichmaessig ueber dem Teig verteilen. Weitere 35

    Min. backen. Die Quiche warm oder kalt geniessen.

