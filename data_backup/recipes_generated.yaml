- recipe_id: 17
  name: Tomaten-Kaese-Dip
  recipe_type: snack
  cook_minutes: null
  prep_minutes: null
  sweet: false
  variant_of: null
  veg_type: vegetarian
  instructions: 'Die Tomaten haeuten und entkernen und zusammen mit dem Ziegenfrischkaese

    und der Sahne in den Zerkleinerer geben. Anschliessend die Blaetter von den

    Thymian- und Zitronenmelissenzweigen abstreifen und mit den uebrigen

    Zutaten im Zerkleinerer zu einem raffinierten Dip verarbeiten. Zuletzt den

    fertigen Dip mit Meersalz und Pfeffer abschmecken und mit gegrilltem

    Fleisch geniessen.'
- recipe_id: 18
  name: Tomatenmarmelade
  recipe_type: snack
  cook_minutes: null
  prep_minutes: null
  sweet: false
  variant_of: null
  veg_type: vegetarian
  instructions: 'Den braunen Zucker in einer Pfanne erhitzen und hellbraun karamellisieren

    lassen. Die Chilischoten laengs halbieren, entkernen und fein hacken. Chili

    dazugeben, Tomatenmark dazugeben und sofort mit dem Essig abloeschen. Die

    Tomaten aus der Dose halbieren, die Kerne herausdruecken und die hacken.

    Kurz kochen lassen und die frischen Tomaten dazugeben, mit Salz und Pfeffer

    wuerzen und bei mittlerer Hitze unter ruehren 12 â€“ 15 Minuten kochen.'
- recipe_id: 19
  name: Tomaten-Paprika-Aufstrich
  recipe_type: snack
  cook_minutes: null
  prep_minutes: null
  sweet: false
  variant_of: null
  veg_type: vegetarian
  instructions: 'Zutaten waschen und wuerfeln. Mit den uebrigen Zutaten bis aus das

    Olivenoel vermischen. 5 Minuten kraeftig auskochen und abschmecken. Dann

    Olivenoel zugeben und verruehren. In heiss ausgespuelte Glaeser fuellen.

    Diese verschliessen und 5 Minuten aus dem Kopf stehen lassen. Kuehl und

    dunkel aufbewahren.'
- recipe_id: 20
  name: Tomatenpesto
  recipe_type: snack
  cook_minutes: null
  prep_minutes: null
  sweet: false
  variant_of: null
  veg_type: vegetarian
  instructions: 'Petersilie und Basilikum kalt abbrausen und gut abtropfen lassen.
    Den Kaese

    fein reiben. Die Sonnenblumenkerne, Kraeuter, den geriebenen Kaese,

    Tomatenmark, Aceto Balsamico, Chili, Pfeffer und Gewuerztes Rapskernoel im

    Mixer oder mit dem Ruehrstab fein puerieren. Mit Salz und Pfeffer pikant

    abschmecken.


    Salate'
- recipe_id: 21
  name: Asiatischer Couscous-Salat
  recipe_type: snack
  cook_minutes: null
  prep_minutes: null
  sweet: false
  variant_of: null
  veg_type: vegetarian
  instructions: 'Bruehe aufkochen, Couscous mit der Fluessigkeit uebergiessen und
    10 Minuten

    ziehen lassen. Die Menge der Fluessigkeit vorher mit der Anweisung auf der

    Verpackung abgleichen. In der Zwischenzeit Paprika und Lauchzwiebel waschen

    und in Streifen bzw. Ringe schneiden. Mais abtropfen lassen. Tomatenmark,

    Currypaste, Essig, OEl und Sojasauce mit dem Couscous vermengen. Klein

    geschnittenes Gemuese und den Mais unterheben und mit Salz und Pfeffer,

    Chili und etwas Zucker abschmecken. Petersilie und Schnittlauch klein

    schneiden und untermischen. Dazu passt gebratene Putenbrust.'
- recipe_id: 22
  name: Bayerischer Krautsalat (((
  recipe_type: snack
  cook_minutes: null
  prep_minutes: null
  sweet: false
  variant_of: null
  veg_type: meat
  instructions: 'Kohl vierteln, putzen, waschen und in feine Streifen schneiden. Mit
    Salz

    vermischen, zugedeckt ziehen lassen bis die anderen Zutaten vorbereitet

    sind.

    Den Speck klein wuerfeln und bei schwacher Hitze unter haeufigem wenden

    braten bis das Fett austritt. Er soll dabei nicht braeunen.

    Zwiebel abziehen, fein hacken, zugeben und unter Ruehren glasig braten.

    Essig und Bruehe dazugeben und aufkochen, dabei ruehren bis sich der

    Bratensatz loest. Kuemmel, Senf und OEl unterruehren. Kraut mit dieser

    Marinade vermischen und zugedeckt bei Zimmertemperatur etwa 3 Stunden

    ziehen lassen. Krautsalat mit Salz und Pfeffer abschmecken.'
- recipe_id: 23
  name: Brotsalat italienische Art
  recipe_type: snack
  cook_minutes: null
  prep_minutes: null
  sweet: false
  variant_of: null
  veg_type: vegetarian
  instructions: 'Olivenoel mit Rosmarin in einer Pfanne erhitzen. Die Salami in Streifen

    schneiden und in der Pfanne kross anbraten. Abkuehlen lassen. Ciabatta in

    Wuerfel schneiden, in der warmen Pfanne die Wuerfel mit Olivenoel darin

    kross roesten evtl. mit dem Knoblauch. Abkuehlen lassen. Ruccola waschen,

    in eine Salatschuessel und mit dem Essig, Salz, Pfeffer wuerzen. Salami,

    Brotwuerfel, Salat alles vermischen. Parmesan reiben und unter den Salat

    mischen.'
