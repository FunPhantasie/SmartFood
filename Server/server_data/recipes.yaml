  instructions: Ergibt 12 Muffins. Speckwuerfel (oder Pancetta) in einer Pfanne bei
    mittlerer Hitze knusprig braten, bis das Fett ausgetreten ist. Speck mit einem
    Schaumloeffel herausnehmen, das Fett in der Pfanne lassen. Lauch (am besten junger
