- cook_minutes: 15
  cooking_method: pan
  instructions: Blattspinat auftauen (evtl. in der Mikrowelle) und das Wasser abgiessen.
    Zwiebeln, Knoblauch und Ingwer schaelen. Tomaten kreuzweise einritzen, mit heissem
    Wasser uebergiessen und haeuten. Alternativ 1/2 Dose gehackte Tomaten verwenden,
    den Saft aber unbedingt abgiessen, damit das Gericht nicht tomatig und roetlich
    wird. Zwiebeln und Tomaten wuerfeln, Knoblauch und Ingwer sehr fein hacken. In
    einer hohen Pfanne Kokosoel erhitzen, Zwiebel, Knoblauch und Ingwer glasig duensten.
    Spinat, Tomaten und Kokosmilch zugeben, mit Salz, Paprikapulver, Kurkuma und Koriander
    wuerzen, umruehren und zugedeckt bei schwacher Hitze ca. 10 Minuten koecheln lassen.
    Zum Schluss die gut abgetropften Kichererbsen unterruehren und kurz ziehen lassen.
    Abschmecken und mit Chiliflocken bestreut servieren.
