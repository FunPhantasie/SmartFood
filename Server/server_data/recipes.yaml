- cook_minutes: 40
  cooking_method: oven
  instructions: 'Hackfleischsauce: 3 Packungen Tomato al Gusto (2x Kraeuter, 1x Pilze), Hackfleisch
    und gehackten Knoblauch im Topf 10 Minuten kochen/koecheln. Mit Salz, Pfeffer und Tabasco
    abschmecken. Kaesesauce: Butter und Mehl 1 Minute anschwitzen. Milch dazu, aufkochen,
    2 Minuten kochen, vom Herd nehmen. 2 Paeckchen (a 40 g) Parmesan dazu, mit Salz und Pfeffer
    abschmecken. Auflaufform mit Butter ausreiben. Hackfleischsauce, Nudeln, Hackfleischsauce,
    Nudeln ..., Nudeln, Kaesesauce schichten, 1 Paeckchen Parmesan drueberstreuen. Bei 200
    Grad 40 Minuten im Ofen (Ober-/Unterhitze) backen.'
  main_ingredient: null
  name: Lasagne
