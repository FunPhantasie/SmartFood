- cook_minutes: 45
  cooking_method: oven
  instructions: Kuerbisfleisch in Wuerfel schneiden und in kochendem Salzwasser ca. 5 Minuten
    garen. Abgiessen und mit einem Puerierstab puerieren. Milch und Margarine unterruehren.
    Mehl, Zucker, Hefe und 2 EL Kuerbiskerne unterkneten. Teig ca. 30 Min. gehen lassen. Teig
    in eine mit Backpapier ausgelegte Kastenkuchenform geben und im vorgeheizten Backofen
    bei 200 Grad ca. 40-50 Min. backen. Kurz abkuehlen lassen, mit Ahornsirup bestreichen
    und mit den restlichen Kuerbiskernen bestreuen.
