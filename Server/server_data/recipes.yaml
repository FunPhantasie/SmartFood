- cook_minutes: 15
  cooking_method: pan
  instructions: Fuer 1 Portion. Das Putenschnitzel waschen, mit dem Cayennepfeffer und dem
    Mehl bestaeuben, danach in mundgerechte Stuecke schneiden. In einer beschichteten Pfanne
    im heissen Oel von allen Seiten goldbraun braten. Herausnehmen und warm stellen. In der
    gleichen Pfanne die gehackten Zwiebeln anbraten. Den Bratsatz mit dem Wasser und dem Sherry
    vom Pfannenboden loesen. Das Mango-Chutney und das Currypulver einruehren. Die Banane
    in Scheiben schneiden, mit dem Zitronensaft betraeufeln und dazugeben. Das Fleisch salzen
    und in der Sauce kurz erwaermen.
