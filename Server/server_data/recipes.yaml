- cook_minutes: 25
  cooking_method: pot
  instructions: Lauch putzen, gruendlich waschen, abtropfen lassen und in ca. 1 cm
    breite Scheiben schneiden. Zwiebeln (weisse) in Streifen, Knoblauch in feine Scheiben
    schneiden. 100 g Parmesan (oder anderen italienischen Hartkaese) fein reiben,
    den Rest in duenne Spaene hobeln. Olivenoel in einem grossen Topf erhitzen. Lauch,
    Zwiebeln, Knoblauch, Thymianstiele und 3 Pimentkoerner darin bei mittlerer Hitze
    5 Minuten duensten. Bruehe, Sahne und geriebenen Kaese unter Ruehren zugeben,
    aufkochen und bei milder Hitze mit halb geschlossenem Deckel ca. 15 Minuten kochen.
    Inzwischen Kichererbsen abspuelen und abtropfen lassen. Tomaten abtropfen lassen,
    dabei 2 EL Tomatenoel auffangen, und grob schneiden. Kichererbsen zum Eintopf
    geben und unter Ruehren 5 Minuten erhitzen. Kurz mit dem Stabmixer anmixen, Tomaten
    unterruehren und mit Salz und Pfeffer abschmecken. Mit Kaesespaenen und Pfeffer
    bestreuen, mit Tomatenoel betraeufeln und servieren.
