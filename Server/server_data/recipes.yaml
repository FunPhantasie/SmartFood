- cook_minutes: 35
  cooking_method: pot
  instructions: Zwiebel klein hacken. Kartoffeln und Suppengemuese schaelen und in
    mundgerechte Stuecke schneiden. Als Suppengemuese eine beliebige Kombination aus
    Moehren, Knollensellerie, Lauch und Petersilienwurzel verwenden (entspricht etwa
    1 Bund). Butter in einem Topf erhitzen und den Speck anbraten. Zwiebeln, Kartoffeln
    und Gemuese zugeben und kurz mitbraten. Linsen unterheben und mit Fleischbruehe
    aufgiessen. Lorbeerblaetter und Majoran zugeben, aufkochen und bei mittlerer Hitze
    zugedeckt 30 Minuten koecheln lassen. 5 Minuten vor Ende der Kochzeit die in Scheiben
    geschnittenen Wiener Wuerstchen in der Suppe erwaermen. Mit Weissweinessig, Salz
    und Pfeffer abschmecken und die Petersilie unterheben.
