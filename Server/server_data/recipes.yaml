- cook_minutes: 25
  cooking_method: pot
  instructions: Zwiebel und Tomaten wuerfeln. Gruene Chilischote in 1 cm Stuecke schneiden.
    Ingwer (daumengross) und Knoblauch mit dem Puerierstab zu einer Paste verarbeiten,
    evtl. etwas Wasser zugeben. Kichererbsen abgiessen und kalt abspuelen. Oel erhitzen
    und Garam Masala, Kurkuma, Kreuzkuemmel, Koriander und Chilipulver kurz anroesten.
    Ingwer-Knoblauch-Paste kurz mitbraten, dann die Zwiebeln anbraten. Tomaten und
    Chili mit dem Wasser zugeben und ca. 15 Minuten offen einkochen lassen, dabei
    oft umruehren. Die Sosse sollte dick sein; bei Bedarf Wasser zugeben, damit nichts
    anbrennt. Kichererbsen hineingeben, mit Salz und einer Prise Zucker abschmecken.
    Nochmals aufkochen und ein paar Kichererbsen zerdruecken, damit die Sosse bindet.
