  instructions: Ergibt 12 Muffins. Kirschtomaten halbieren, mit Olivenoel und etwas
    Salz bei 160 Grad 30 Minuten roesten. Knoblauch hacken, zu den Tomaten geben und
    weitere 10 Minuten roesten. Spinat grob hacken (nicht zu fein). Tomaten, Spinat
    und zerbroeselten Feta in eine Muffinform (antihaftbeschichtet oder gefettet)
    verteilen. Eier mit Salz und Pfeffer verquirlen und daruebergiessen. Bei 170 Grad
