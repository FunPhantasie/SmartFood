- cook_minutes: 25
  cooking_method: oven
  instructions: Fuer 4 Personen. Backofen auf 200 Grad vorheizen. Fisch in mundgerechte Stuecke
    schneiden, leicht salzen und mit Zitronensaft betraeufeln. Olivenoel erwaermen und die
    gepresste Knoblauchzehe kurz darin anbraten. Tomatenfruchtfleisch zugeben, erwaermen.
    Den Sugo mit Basilikum, Honig, Pfeffer und Salz abschmecken und in die Auflaufform geben.
    Fischstuecke (alternativ Kabeljau) und die Gnocchi in die Auflaufform geben. Fuer die
    Kaesesauce Sahne mit den Kraeutern und 1 Tasse Wasser erwaermen. Parmesan zugeben und
    langsam aufloesen lassen. Speisestaerke mit 2 EL Wasser und dem Wermut verruehren und
    zur Sahne geben. Mit Paprika, Pfeffer und Salz abschmecken. Die Sauce ueber Fisch und
    Gnocchi verteilen und alles auf der mittleren Schiene 25 Minuten ueberbacken. Mit Basilikum
    bestreuen und servieren.
