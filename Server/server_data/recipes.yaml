  instructions: Haehnchen (alternativ Haehnchenschenkel ohne Haut und Knochen) in
    mundgerechte Stuecke schneiden. Fruehlingszwiebeln in Ringe schneiden, Knoblauch
    klein hacken. Fuer die Teriyaki-Sauce Sojasauce, Zucker, Reisessig, Mirin und
    Sesamoel verruehren. Mirin kann durch trockenen Weisswein oder, alkoholfrei, durch
