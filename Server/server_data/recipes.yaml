- cook_minutes: 15
  cooking_method: pan
  instructions: 'Partyrezept. Dip: Gurke schaelen, fein raspeln, abtropfen lassen. Knoblauch
    fein hacken und mit Quark, Joghurt und Schmand verruehren. Gurkenraspel gut ausdruecken
    und unter den Quark heben. Dill klein schneiden und in den Quark geben. Mit Salz und Pfeffer
    abschmecken. Pfanne: Zwiebeln in feine Scheiben hobeln, mit Salz, Essig und Oregano wuerzen
    und durchziehen lassen. Oel erhitzen, Gyros darin portionsweise anbraten und bei starker
    Hitze knusprig braun braten. Gyros mit Zwiebeln und Knoblauch-Dill-Quark anrichten. Beilage:
    Fladenbrot.'
