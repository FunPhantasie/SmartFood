- cook_minutes: 25
  cooking_method: oven
  instructions: Chicoree waschen, putzen. Den bitteren Kern am Wurzelende aus der Mitte keilfoermig
    herausschneiden. In kochendes, leicht gesalzenes Wasser geben. Butter und Zitronensaft
    sofort hinzugeben. 10 Minuten kochen, dann herausnehmen, abtropfen lassen. Jede Stange
    in Schinken, dann in Kaese einwickeln und in eine gefettete feuerfeste Form legen. Dosentomaten
    mit Saft um den Chicoree legen, salzen und pfeffern. Die Butter in Floeckchen darueber
    verteilen. Im vorgeheizten Backofen 15 Minuten bei 220 Grad backen. Dazu Weissbrot oder
    Schwarzbrot servieren.
