  instructions: 'Fuer 4 Portionen. Zwiebel, Knoblauch und Moehre schaelen und in feine
    Wuerfel schneiden. Hackfleisch (alternativ Tatar) in die Pfanne geben, langsam
    erhitzen und im eigenen Fett unter Ruehren bei mittlerer Hitze anbraten. So bleibt
    das Fleisch schoen saftig. Salzen und pfeffern. Zwiebeln, Knoblauch und Moehren
    dazugeben und kurz mitbraten. Fuer mehr klassisches Bolognese-Aroma optional 1
    Stange Sellerie fein wuerfeln und mitbraten. Mit der Bruehe abloeschen. Dann Tomatenmark,
    Oregano, die stueckigen Tomaten (z. B. mit Kraeutern aus dem Tetrapack) und Ketchup
    unterruehren. Etwa 40 Minuten bei milder Hitze einkochen lassen. Optional 100-200
    ml Vollmilch nach Bedarf zugeben: Sie macht die Sauce saemiger, haelt das Hackfleisch
    zart und hilft, wenn die Bolognese zu stark einkocht. Spaghetti in Salzwasser
