- cook_minutes: 100
  cooking_method: pot
  instructions: Fuer 6 Portionen. Fleisch wuerfeln. Zwiebeln in feine Ringe schneiden. Oel
    in einem grossen Suppentopf erhitzen. Zwiebelringe darin goldgelb anbraten und mit Paprikapulver
    vermischen. Einen Schuss Fleischbruehe zufuegen. Fleisch hineingeben und rundherum anbraten.
    Leicht salzen und pfeffern. Mit Fleischbruehe abloeschen. Tomaten samt Saft hinzufuegen.
    Zwiebel mit Nelken spicken. Majoran, Lorbeerblaetter und die gespickte Zwiebel in die
    Suppe geben. 1 1/2 Stunden koecheln lassen. Die Kartoffeln wuerfeln und etwa 15 Min. vor
    Ende der Garzeit zur Suppe geben. Die Paprika in Streifen schneiden. Die gespickte Zwiebel
    und die Lorbeerblaetter aus dem Topf fischen. Die Suppe mit Salz, Pfeffer und Rosenpaprika
    abschmecken.
  main_ingredient: null
