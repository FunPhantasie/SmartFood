- cook_minutes: 30
  cooking_method: oven
  instructions: Linsen in einem Sieb gruendlich abspuelen. Zwiebel und Knoblauch klein
    hacken. Moehren schaelen und in ganz kleine Wuerfel schneiden oder raspeln. Oel
    in einer Pfanne erhitzen und Zwiebeln, Knoblauch und Moehren 2 Minuten anduensten.
    Linsen und Gemuesebruehe zugeben, aufkochen und zugedeckt bei mittlerer Hitze
    10-15 Minuten koecheln lassen. Passierte Tomaten (alternativ gehackte Tomaten)
    und Kraeuter unterheben und mit Salz und Pfeffer abschmecken. Backofen auf 200
    Grad Ober- und Unterhitze vorheizen. Eine Auflaufform mit Butter einfetten, eine
    Schicht Linsensauce hineingeben und mit Lasagneplatten bedecken. Weiter schichten,
    bis alles aufgebraucht ist; die oberste Schicht ist Sauce. Creme fraiche (alternativ
    Schmand) mit 3 EL Wasser verruehren und darauf verstreichen. Mit geriebenem Mozzarella
    bedecken und 30 Minuten backen.
