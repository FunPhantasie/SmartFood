- cook_minutes: 10
  cooking_method: grill
  instructions: Die Blaettchen von der Haelfte des Thymians abzupfen. Die restlichen
    Zweige umgekehrt in eine Schale mit 6 EL Olivenoel und 2 TL Salz legen. Ab und
    zu umruehren (ergibt den Thymianpinsel). Mehl, Hefe, Thymianblaetter und 1 TL
    Salz in einer Schuessel mischen. Wasser und 2 EL Olivenoel dazugeben, zu einem
    glatten Teig verkneten und 1 Stunde an einem warmen Ort zugedeckt gehen lassen.
    Den Teig in 6 Portionen teilen und auf einer bemehlten Oberflaeche zu flachen
    Fladen ausrollen. Auf einer Seite mit dem Thymianpinsel bestreichen und dann mit
    dieser Seite nach unten auf den heissen Grill legen. 4-5 Minuten grillen, die
    zweite Seite auch bepinseln, wenden und weitere 4-5 Minuten grillen. Dazu passen
    selbst gemachte Dips.
