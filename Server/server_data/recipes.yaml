- cook_minutes: 30
  cooking_method: pot
  instructions: Fuer 4 Personen. Vom Kuerbis die harte Schale abschneiden und die Kerne entfernen,
    das Fruchtfleisch grob wuerfeln. Zwiebel und Knoblauch fein hacken. Zuerst die Zwiebeln
    in Butter anschwitzen, dann Knoblauch zugeben. Er darf keine Farbe annehmen, sonst wird
    er bitter. Die Kuerbiswuerfel zugeben und 5 bis 10 Minuten duensten. Mit der Fleischbruehe
    auffuellen und 15 Minuten koecheln lassen. Den Weisswein zugeben. Dann passieren oder
    mit dem Mixstab puerieren. Den Schmelzkaese zugeben und unterruehren, bis er sich aufgeloest
    hat. Mit wenig Salz wuerzen, viel frisch gemahlenen Pfeffer, Piment, Ingwer und eine Prise
    Cayennepfeffer zugeben. Mit Toastbrotwuerfeln servieren.
  main_ingredient: null
