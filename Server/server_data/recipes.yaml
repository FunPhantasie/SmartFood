- cook_minutes: 10
  cooking_method: oven
  instructions: Mehl, geriebenen Kaese, Butterfloeckchen, Ei und Gewuerze zu einem
    Muerbeteig verkneten. Den Teig 1 Stunde im Kuehlschrank ruhen lassen. Danach den
    Teig auf leicht bemehlter Arbeitsflaeche etwa 1/2 cm dick auswellen. Beliebige
    Plaetzchen ausstechen. Die Plaetzchen mit dem Eigelb (mit der Sahne verquirlt)
    bestreichen und nach Wunsch mit gehackten Erdnuessen, Pistazien, Kuemmel, Mohn
    oder Sesam verzieren. Im vorgeheizten Backofen auf der oberen Schiene bei 200
    Grad ca. 10 Minuten goldgelb backen.
