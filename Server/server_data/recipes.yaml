- cook_minutes: 60
  cooking_method: oven
  instructions: Backofen auf 205 Grad Ober-/Unterhitze vorheizen. Von den Knoblauchknollen
    eine Kappe abschneiden, mit 1 EL Olivenoel betraeufeln, mit 1 TL Salz bestreuen,
    in Alufolie wickeln und 45-60 Minuten roesten. Zwiebeln reiben und gruendlich
    ausdruecken. Rinderhack (700-900 g, mager) mit gehacktem Knoblauch, 2 TL geraeuchertem
    Paprikapulver, 2 TL Kreuzkuemmel, Piment, 2 TL Salz, 2 TL Pfeffer, Kurkuma, Zimt,
    ca. 20 g Petersilie, optional Koriander und den Zwiebeln 2-3 Minuten kneten. Auf
    einem Backblech zu einem ca. 1,25 cm dicken Rechteck druecken, in 2,5 cm breite
    Streifen einschneiden und mit 4 EL Olivenoel betraeufeln. 12-15 Minuten backen,
    dann 2-5 Minuten unter dem Grill knusprig werden lassen. Fuer den Salat rote Zwiebel,
    geviertelte Kirschtomaten, ca. 10 g Petersilie, je 1 TL Salz und Pfeffer, Sumach
    und den Saft einer halben Zitrone mischen. Fuer die Sauce die Roestknoblauchzehen
    ausdruecken und zerdruecken, mit Joghurt, Saft einer halben Zitrone, Tahini, Eiswasser
    und je 1 TL Paprikapulver, Kreuzkuemmel, Salz und Pfeffer verruehren (optional
    Kraeuter dazu). Lavash oder Pita mit Sauce bestreichen, Kefta und Salat darauflegen,
    fest aufrollen und in einer leicht geoelten Pfanne von beiden Seiten knusprig
    anbraten.
