  instructions: Fuer 4 Portionen. Bauchspeck (idealerweise Pancetta) in sehr kleine
    Wuerfel schneiden. Moehre schaelen, Sellerie von Gruen und Faeden befreien, waschen;
    beides sowie die Zwiebeln in sehr feine Wuerfel schneiden. Oel in einem Topf erhitzen
    und zuerst die Speckwuerfel allein 1-2 Minuten anduensten. Butter, Zwiebel-, Sellerie-
    und Moehrenwuerfel zugeben und bei mittlerer Hitze ca. 3 Minuten duensten, dabei
    gut umruehren. Hackfleisch (halb Rind, halb Schwein) zugeben, mit 1 TL Salz und
    1/4 TL Pfeffer wuerzen, mit einem Holzloeffel zerkruemeln und garen, bis es nicht
    mehr roh aussieht. Tomatenmark unterruehren. Mit der Milch abloeschen und koecheln
    lassen, bis sie fast verdampft ist; dabei eine Messerspitze Muskatnuss zugeben.
    Optional danach 125 ml Rotwein zugiessen und einkoecheln lassen. Passierte Tomaten
    und Lorbeerblatt zugeben, gut verruehren und bei mittlerer bis kleiner Hitze mit
    halb geoeffnetem Deckel ca. 40 Minuten koecheln lassen. Wird es zu trocken, essloeffelweise
    Milch oder Wasser zugeben (ein echtes Ragu ist keine fluessige Sosse). Mit Salz
    und Pfeffer abschmecken. Dazu Nudeln nach Wahl, z. B. Spaghetti oder Tagliatelle.
  main_ingredient:
