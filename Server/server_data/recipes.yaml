- cook_minutes: 45
  cooking_method: pot
  instructions: In einem grossen Topf oder Braeter Oel auf hoher Stufe erhitzen. Hackfleisch
    (alternativ halb Rinder-, halb Schweinehack) zufuegen, kurz liegen lassen, dann
    zerkleinern und rundherum anbraten. Sobald Roestaromen entstehen, die Hitze etwas
    reduzieren. Zwiebeln schaelen, wuerfeln und zum Hackfleisch geben. Paprika waschen,
    putzen, in 1 cm grosse Wuerfel schneiden und untermengen. In der Mitte des Topfbodens
    eine freie Flaeche schaffen, Tomatenmark darin etwas anroesten, vermengen und
    kurz koecheln lassen. Knoblauch schaelen, fein wuerfeln und zusammen mit den Dosentomaten,
    Salz, Pfeffer, Zucker und den Gewuerzen unterruehren (Chilipulver kann durch Cayennepfeffer,
    Tabasco durch eine andere Wuerzsauce ersetzt werden; vorsichtig dosieren und am
    Ende nachwuerzen). Mit etwas Bruehe (Rinder- oder Gemuesebruehe) auffuellen und
    bei mittlerer Hitze 30-45 Minuten kochen lassen; ist die Fluessigkeit verkocht,
    immer wieder Bruehe angiessen. Kurz vor Ende der Garzeit Bohnen und Mais gruendlich
    abspuelen, zufuegen und nur wenige Minuten mitgaren. Mit Salz und Gewuerzen abschmecken.
    Wer moechte, toppt das Chili mit Schmand und Petersilie. Dazu passen Baguette,
    Tortillas oder Nachos.
