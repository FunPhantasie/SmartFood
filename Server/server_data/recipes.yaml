  instructions: Hefeteig aus Hefe, Milch, Wasser, Zucker, 300 g Mehl, 1 Ei, etwas
    Salz und Margarine zubereiten. Zwiebeln in Ringe schneiden, Speck in einer Pfanne
    zerlassen. Zwiebeln darin anduensten, mit Salz, Pfeffer, Kuemmel und Muskatnuss
    abschmecken. Teig ausrollen und ca. 30 Min. gehen lassen. Danach mit der Speck-Zwiebel-Mischung
    belegen. Restliches Ei mit saurer Sahne verquirlen, mit Salz, Pfeffer und Muskatnuss
