  instructions: Zwiebel fein wuerfeln und Knoblauch hacken. Paprika in Wuerfel, Sellerie in
    Scheiben schneiden und aus dem Kuerbis mit einem Melonenausstecher kleine Kugeln ausstechen.
    Tatar im erhitzten Kuerbiskernoel anbraten, Gemuese zugeben und anduensten. Tomaten, Tomatenmark
    und Bruehe angiessen und alles ca. 15-20 Minuten garen. Mit den Gewuerzen und Zucker abschmecken
    und mit Tortillachips servieren.
