- cook_minutes: 25
  cooking_method: pan
  instructions: Fuer 4 Personen. Kartoffeln unter Wasser kraeftig abbuersten und abtropfen
    lassen. Kartoffeln in Spalten schneiden. Die Margarine in einer beschichteten Pfanne erhitzen
    und die Kartoffeln unter Wenden ca. 20 Minuten goldbraun braten. Paprika putzen, waschen
    und in feine Streifen schneiden. Knoblauch schaelen, hacken. Zwiebel schaelen und 2/3
    davon in Streifen schneiden. Zwiebelstreifen, Paprika und Knoblauch ca. 10 Minuten vor
    Ende der Garzeit zu den Kartoffeln geben und mitbraten. Mit Gyrosgewuerz, wenig Salz und
    Pfeffer wuerzen. Thymian mit den Oliven kurz vor Ende der Bratzeit zu den Kartoffeln geben.
    Kaese zerbroeckeln. Restliche Zwiebeln grob wuerfeln. Mit dem Schafskaese ueber die Gyros-Kartoffeln
    streuen und servieren.
  main_ingredient: null
  name: Kartoffel-Gyros mit Schafskaese
