- cook_minutes: 50
  cooking_method: oven
  instructions: Putenschnitzel mit Salz, Pfeffer, Knorr-Aromat und Maggi Wuerzmittel Nr. 3
    wuerzen. Bresso-Kraeuterkaese auf die Schnitzel streichen, je 1 Scheibe rohen Schinken
    darauf legen und aufrollen. Roellchen in Ei und Paniermehl waelzen und in der Pfanne anbraten.
    Auflaufform ausbuttern und die Roellchen nebeneinander legen. Kraeutersauce mit Wasser
    aufkochen. Sahne und Adler-Schmelzkaese dazugeben. Die Sauce um die Roellchen giessen.
    Das Fleisch darf nicht bedeckt sein, hoechstens bis zur Haelfte. Im Backofen bei 200 Grad
    40-50 Minuten garen.
