<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>SmartFood – Select</title>
  <style>
    :root{
      --bg:#0b0f17;
      --card:#121a2a;
      --card2:#0f1626;
      --text:#e9eefc;
      --muted:#a7b4d6;
      --line:#24314f;
      --accent:#7aa2ff;
      --danger:#ff6b6b;
      --ok:#4cd4a6;
      --shadow: 0 10px 30px rgba(0,0,0,.35);
      --radius: 16px;
    }
    *{box-sizing:border-box}
    body{
      margin:0;
      font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial;
      background: radial-gradient(900px 500px at 30% 0%, #172141 0%, var(--bg) 55%) fixed;
      color:var(--text);
    }
    header{
      padding:18px 18px 8px;
      position:sticky;
      top:0;
      backdrop-filter: blur(10px);
      background: rgba(11,15,23,.65);
      border-bottom:1px solid rgba(255,255,255,.06);
      z-index:5;
    }
    header .row{
      max-width: 1200px;
      margin:0 auto;
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:12px;
    }
    .brand{
      display:flex;
      align-items:center;
      gap:10px;
      font-weight:800;
      letter-spacing:.3px;

      flex:1;
    }
    .pill{
      font-size:12px;
      color:var(--muted);
      border:1px solid rgba(255,255,255,.10);
      padding:6px 10px;
      border-radius:999px;
      background: rgba(255,255,255,.04);
    }
    main{
      display: flex;
      justify-content: center;
      padding:0 18px;
    }
    .grid{
      display:grid;
      grid-template-columns: 1fr 1fr;
      gap:16px;
      align-items:start;
    }
    @media (max-width: 980px){
      .grid{grid-template-columns: 1fr;}
    }

    .panel{
      background: linear-gradient(180deg, rgba(255,255,255,.05), rgba(255,255,255,.02));
      border:1px solid rgba(255,255,255,.08);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      overflow:hidden;
    }
    .panel .hd{
      padding:14px 14px 10px;
      border-bottom:1px solid rgba(255,255,255,.08);
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:10px;
    }
    .panel .hd h2{
      font-size:14px;
      margin:0;
      color:var(--text);
      letter-spacing:.2px;
    }
    .panel .bd{ padding:14px; }

    .muted{color:var(--muted)}
    .help{font-size:12px; color:var(--muted); line-height:1.35; margin: 6px 0 0;}
    html{ color-scheme: dark; }
    label{ display:block; font-size:12px; color:var(--muted); margin: 12px 0 6px; }
    select{
      background-color: var(--card);
    }
    select option{
      background-color: var(--card);
      color: var(--text);
    }

    select, input[type="text"]{
      width:100%;
      padding:12px 12px;
      border-radius:12px;
      border:1px solid rgba(255,255,255,.10);
      background: rgba(255,255,255,.05);
      color:var(--text);
      outline:none;
    }
    select:focus, input[type="text"]:focus{
      border-color: rgba(122,162,255,.55);
      box-shadow: 0 0 0 3px rgba(122,162,255,.15);
    }
    .row2{
      display:grid;
      grid-template-columns: 1fr 1fr;
      gap:10px;
    }
    @media (max-width:520px){
      .row2{ grid-template-columns: 1fr; }
    }
    .btnrow{
      display:flex;
      gap:10px;
      flex-wrap:wrap;
      margin-top:14px;
    }
    .button-row {
      margin-left: auto;    /* <-- schiebt die Button-Gruppe nach rechts */
      display:flex;
      gap:12px;
    }
    button{
      border:none;
      border-radius:12px;
      padding:12px 14px;
      color:var(--text);
      background: rgba(122,162,255,.25);
      border:1px solid rgba(122,162,255,.35);
      cursor:pointer;
      font-weight:650;
      letter-spacing:.2px;
    }
    button:hover{ background: rgba(122,162,255,.33); }
    button.secondary{
      background: rgba(255,255,255,.06);
      border:1px solid rgba(255,255,255,.12);
      color:var(--text);
    }
    button.danger{
      background: rgba(255,107,107,.16);
      border:1px solid rgba(255,107,107,.28);
    }

    .chiprow{ display:flex; flex-wrap:wrap; gap:8px; margin-top:10px;}
    .chip{
      display:inline-flex;
      align-items:center;
      gap:8px;
      padding:8px 10px;
      border-radius:999px;
      background: rgba(255,255,255,.06);
      border:1px solid rgba(255,255,255,.10);
      font-size:12px;
      color:var(--text);
    }
    .chip .x{
      width:18px; height:18px;
      border-radius:999px;
      display:grid; place-items:center;
      background: rgba(255,255,255,.10);
      border:1px solid rgba(255,255,255,.12);
      cursor:pointer;
      font-weight:800;
      line-height:1;
      user-select:none;
    }
    .chip .x:hover{ border-color: rgba(255,255,255,.25); }

    .cards{ display:flex; flex-direction:column; gap:10px; }
    .card{
      background: rgba(10,14,22,.55);
      border:1px solid rgba(255,255,255,.09);
      border-radius: 14px;
      padding:12px 12px 10px;
      position:relative;
    }
    .card .title{
      font-weight:750;
      font-size:13px;
      margin:0 34px 6px 0;
    }
    .card .meta{
      font-size:12px;
      color:var(--muted);
      display:flex;
      gap:10px;
      flex-wrap:wrap;
    }
    .closebtn{
      position:absolute;
      top:10px; right:10px;
      width:28px; height:28px;
      border-radius:10px;
      border:1px solid rgba(255,255,255,.12);
      background: rgba(255,255,255,.06);
      display:grid; place-items:center;
      cursor:pointer;
      user-select:none;
      font-weight:900;
      color: var(--text);
    }
    .closebtn:hover{
      border-color: rgba(255,107,107,.38);
      background: rgba(255,107,107,.12);
    }

    .splitHd{
      display:flex; align-items:center; justify-content:space-between; gap:10px;
      margin: 6px 0 10px;
    }
    .splitHd h3{
      margin:0;
      font-size:13px;
      letter-spacing:.2px;
    }
    .smalllink{
      font-size:12px;
      color:var(--accent);
      text-decoration:none;
      cursor:pointer;
      user-select:none;
    }
    .panel .bd.collapsed { display: none; }
    #filterSection.collapsed { display: none; }
      background: rgba(255,255,255,.08);
      padding: 1px 6px;
      border-radius: 8px;
      border:1px solid rgba(255,255,255,.10);
    }
  </style>
</head>
<body>
  <script src="/static/nav.js"></script>
  <header>
    <div class="row">
      <div class="brand">
        <div style="width:28px;height:28px;border-radius:10px;background:rgba(122,162,255,.25);border:1px solid rgba(122,162,255,.35);display:grid;place-items:center;font-weight:900;">SF</div>
        <div>SmartFood</div>
        <span id="sf-user-slot" style="display:flex; align-items:center; gap:6px; margin-left:6px;"></span>
        <div class="button-row">
        <button class="btn" onclick="location.href=window.SmartFoodUser.decorate('/create')">Create Recipe</button>
        <button class="btn" onclick="location.href=window.SmartFoodUser.decorate('/ingredients')">Ingredients</button>
        <button class="btn good" id="btnAddRecipe" style="display:none;" >🛒 Aktuelle Auswahl laden</button>
        </div>
      </div>
      <span class="pill" id="backendState">Backend: unknown</span>
    </div>
  </header>

  <main>
    <!-- SUGGESTIONS -->
    <section class="panel" aria-label="suggestions" style="max-width:800px; width:100%;">
      <div class="hd">
        <h2>Suggestions</h2>
        <button class="secondary" type="button" id="toggleFilter" style="font-size:12px; padding:6px 10px;">Show Filters</button>
      </div>

      <div class="bd">
        <!-- FILTER SECTION -->
        <div id="filterSection" class="collapsed">
          <div class="row2">
            <div>
              <label for="mealType">Meal type</label>
              <select id="mealType">
                <option value="main_dish">Main</option>
                <option value="side">Side</option>
                <option value="dessert">Dessert</option>
                <option value="breakfast">Breakfast</option>
                <option value="snack">Snack</option>
                <option value="spice_mix">Gewürzmischung</option>
              </select>
              <div class="help">Hinweis: Gewürzmischungen sind jetzt ein eigener Meal-Type (nicht „Spicy Level“).</div>
            </div>

            <div>
              <label for="diet">Typ</label>
              <select id="diet">
                <option value="any">Any</option>
                <option value="nonvegan">Non-vegan</option>
                <option value="vegetarian">Vegetarian</option>
                <option value="vegan">Vegan</option>
              </select>
            </div>
          </div>

          <div class="row2">
            <div>
              <label for="numShow">Show results</label>
              <select id="numShow">
                <option value="5" selected>5 (default)</option>
                <option value="8">8</option>
                <option value="10">10</option>
              </select>
              <div class="help">Backend darf z.B. 10 schicken – angezeigt wird erstmal die gewählte Anzahl, der Rest bleibt im Puffer.</div>
            </div>
            <div>
              <label for="freeText">Free text</label>
              <input id="freeText" type="text" placeholder="z.B. high protein, glutenfrei, schnell..." />
            </div>
          </div>

          <label for="includeInput">Include ingredient/tag</label>
          <div class="row2">
            <div>
              <input id="includeInput" list="includeOptions" type="text" placeholder="Tippen oder auswählen…" />
              <datalist id="includeOptions">
                <option value="chicken"></option>
                <option value="rice"></option>
                <option value="tofu"></option>
                <option value="broccoli"></option>
                <option value="tomato"></option>
                <option value="oats"></option>
                <option value="curry"></option>
                <option value="garlic"></option>
              </datalist>
            </div>
            <div class="btnrow" style="margin:0">
              <button class="secondary" type="button" id="addInclude">Add</button>
            </div>
          </div>
          <div class="chiprow" id="includeChips" aria-label="include list"></div>

          <label for="excludeInput">Exclude ingredient/tag</label>
          <div class="row2">
            <div>
              <input id="excludeInput" list="excludeOptions" type="text" placeholder="Tippen oder auswählen…" />
              <datalist id="excludeOptions">
                <option value="peanuts"></option>
                <option value="lactose"></option>
                <option value="gluten"></option>
                <option value="fish"></option>
                <option value="cilantro"></option>
              </datalist>
            </div>
            <div class="btnrow" style="margin:0">
              <button class="secondary" type="button" id="addExclude">Add</button>
            </div>
          </div>
          <div class="chiprow" id="excludeChips" aria-label="exclude list"></div>

          <div class="btnrow">
            <button type="button" id="proposeBtn">Propose</button>
          </div>
        </div>

        <!-- DEFAULT PANELS -->
        <div id="defaultsWrap">
          <div class="splitHd">
            <h3>5 Main Gerichte</h3>
            <span class="muted" style="font-size:12px" id="mainCount"></span>
          </div>
          <div class="cards" id="mainCards"></div>

          <div class="btnrow" style="margin-top:14px;">
            <button type="button" id="generateBtn">Generate New Proposal</button>
            
          </div>
        </div>

        </div>
      </div>
    </section>
  </main>

<script>
/** -------------------------
 *  State
 *  ------------------------- */
const state = {
  include: [],
  exclude: [],
  defaults: {
    main_dish: { shown: [], buffer: [] },
  },
  backendOk: null
};

const RECIPE_TYPE_TO_SECTION = {
  "main_dish": "Hauptgericht",
  "side_dish": "Nebenspeise",
  "snack": "Snack",
  "dip": "Dip",
  "sweet": "Süßspeise",
  "wuerzung": "Gewürzmischung",
};

const LIMIT_DEFAULTS = { main_dish: 5 };
//Objetc Mit KEy PAirs

/** -------------------------
 *  Utilities
 *  ------------------------- */
function uid(prefix="r"){
  return prefix + "_" + Math.random().toString(16).slice(2) + "_" + Date.now().toString(16);
}

function titleCase(s){
  return (s||"").split(/[\s_-]+/).filter(Boolean).map(w=>w[0]?.toUpperCase()+w.slice(1)).join(" ");
}

function prettyMealType(type){
  return RECIPE_TYPE_TO_SECTION[type] ?? type ?? "—";
}

/** -------------------------
 *  Check If BAckend IS Online (Ping) Not Implenetet Server=
 *  ------------------------- */
async function checkBackendOnline(){
  // Optional endpoint: /api/ping -> {ok:true}
  try{
    const r = await fetch("/api/ping", {method:"GET"});
    if(!r.ok) throw new Error("ping not ok");
    state.backendOk = true;
  }catch(e){
    state.backendOk = false;
  }
  const el = document.getElementById("backendState");
  el.textContent = "Backend: " + (state.backendOk ? "online" : "offline (mock)");
  el.style.borderColor = state.backendOk ? "rgba(76,212,166,.45)" : "rgba(255,255,255,.12)";
  el.style.background = state.backendOk ? "rgba(76,212,166,.12)" : "rgba(255,255,255,.04)";
}

async function dismissSuggestion(recipe, context){
  // context: {mode:"defaults"|"results", section:"main"|"snack"|"results"}
  const payload = {
    recipe_id: recipe?.id,
    recipe_name: recipe?.name,
    recipe_type: recipe?.recipe_type,
    context
  };
  try{
    await fetch("/api/dismiss", {
      method:"POST",
      headers: {"Content-Type":"application/json"},
      body: JSON.stringify(payload)
    });
  }catch(e){
    // offline ok
  }
}

async function fetchRecipes(filters = null){
  // Fetch recipes from backend - with or without filters
  // If filters provided: POST request
  // If no filters: GET request (defaults)
  try{
    let r;
    if(filters){
      r = await fetch("/api/propsals", {
        method: "POST",
        headers: {"Content-Type":"application/json"},
        body: JSON.stringify(filters)
      });
    } else {
      const user = window.SmartFoodUser?.get() || "";
      r = await fetch("/api/propsals?user=" + encodeURIComponent(user), {method: "GET"});
    }
    
    if(!r.ok) throw new Error("fetch failed");
    const data = await r.json();
    
    if(filters){
      // POST response expects {recipes: [...]}
      const recipes = Array.isArray(data?.recipes) ? data.recipes : [];
      if(recipes.length === 0) throw new Error("empty");
      return recipes;
    } else {
      // GET response expects {main_dish: [...]}
      const recipes = Array.isArray(data?.main_dish) ? data.main_dish : [];
      if(recipes.length === 0) throw new Error("empty");
      return recipes;
    }
  }catch(e){
    console.warn("Backend fetch failed", e);
    return [];
  }
}

/** -------------------------
 *  UI: chips include/exclude
 *  ------------------------- */
function renderChips(kind){
  const wrap = document.getElementById(kind==="include" ? "includeChips" : "excludeChips");
  const items = state[kind];
  wrap.innerHTML = "";
  items.forEach((v, idx)=>{
    const chip = document.createElement("div");
    chip.className = "chip";
    chip.innerHTML = `<span>${v}</span><span class="x" title="remove">×</span>`;
    chip.querySelector(".x").addEventListener("click", ()=>{
      items.splice(idx,1);
      renderChips(kind);
    });
    wrap.appendChild(chip);
  });
}

function addChip(kind, value){
  const v = (value||"").trim();
  if(!v) return;
  const items = state[kind];
  if(items.includes(v)) return;
  items.push(v);
  renderChips(kind);
}

/** -------------------------
 *  UI: cards rendering + dismiss behavior
 *  ------------------------- */

function edit(recipe){
  location.href = window.SmartFoodUser.decorate(`/recipe?id=${encodeURIComponent(recipe.id)}`);
}
function cardEl(recipe, onClose){
  const div = document.createElement("div");
  div.className = "card";
  div.innerHTML = `
    <div class="closebtn" title="dismiss">×</div>
    <p class="title">${recipe.name}</p>
    <div class="meta">
      <span><b>${prettyMealType(recipe.recipe_type)}</b></span>
      <span>Typ: <b>${recipe.veg_type ?? "?"}</b></span>
      <span>~<b>${recipe.cook_t+recipe.prep_t ?? "?"}</b> min</span>
    </div>
  `;
  // Klick auf die Karte -> Detailseite
  div.addEventListener("click", () => edit(recipe));

  // Klick auf X -> nur dismiss, nicht navigieren
  div.querySelector(".closebtn").addEventListener("click", (e) => {
    e.stopPropagation();
    onClose();
  });
  return div;
}

function renderSection(sectionKey){
  // sectionKey: "main" | "snack"
  const cfg = state.defaults[sectionKey];
  const wrap = document.getElementById(sectionKey==="main_dish" ? "mainCards" : "snackCards");
  wrap.innerHTML = "";
  cfg.shown.forEach((r, idx)=>{
    wrap.appendChild(cardEl(r, async ()=>{
      await dismissSuggestion(r, {mode:"defaults", section: sectionKey});
      // remove
      cfg.shown.splice(idx, 1);
      // refill to keep 3
      if(cfg.buffer.length > 0){
        cfg.shown.push(cfg.buffer.shift());
      }
      renderSection(sectionKey);
    }));
  });

  const countEl = document.getElementById(sectionKey==="main_dish" ? "mainCount" : "snackCount");
  countEl.textContent = `${cfg.shown.length}/${LIMIT_DEFAULTS[sectionKey]} shown · buffer ${cfg.buffer.length}`;
}



/** -------------------------
 *  Defaults generation on load
 *  ------------------------- */
function initDefaults(){
  // always generate 5 main on load
  const mainAll = "none";
  state.defaults.main_dish.shown  = mainAll.slice(0, LIMIT_DEFAULTS.main_dish);
  state.defaults.main_dish.buffer = mainAll.slice(LIMIT_DEFAULTS.main_dish);

  renderSection("main_dish");
}
async function loadDefaultRecipes(){
  // Load default recipes on page load
  const recipes = await fetchRecipes();
  
  if(recipes.length === 0){
    console.warn("No default recipes, using mock fallback");
    initDefaults();
  } else {
    state.defaults.main_dish.shown = recipes.slice(0, LIMIT_DEFAULTS.main_dish);
    state.defaults.main_dish.buffer = recipes.slice(LIMIT_DEFAULTS.main_dish);
  }
  
  renderSection("main_dish");
}




/** -------------------------
 *  Propose (selection) flow
 *  ------------------------- */
async function onPropose(){
  const filters = {
    meal_type: document.getElementById("mealType").value,
    diet: document.getElementById("diet").value,
    include: [...state.include],
    exclude: [...state.exclude],
    free_text: document.getElementById("freeText").value.trim(),
    user_id: window.SmartFoodUser?.get() || ""
  };

  const showN = parseInt(document.getElementById("numShow").value, 10) || 5;
  filters.count = Math.max(10, showN);   // Rest bleibt als Puffer fuers Wegklicken
  
  const recipes = await fetchRecipes(filters);
  
  state.defaults.main_dish.shown = recipes.slice(0, showN);
  state.defaults.main_dish.buffer = recipes.slice(showN);

  renderSection("main_dish");



}

/** -------------------------
 *  Add recipe button (stub)
 *  ------------------------- */
function onAddRecipe(){
  // Placeholder: later open file picker + upload + background processing.
  alert("Add recipe: Platzhalter. Später hängen wir hier Upload + Hintergrund-Verarbeitung dran.");
}

/** -------------------------
 *  Wiring
 *  ------------------------- */
document.getElementById("addInclude").addEventListener("click", ()=>{
  addChip("include", document.getElementById("includeInput").value);
  document.getElementById("includeInput").value = "";
});
document.getElementById("addExclude").addEventListener("click", ()=>{
  addChip("exclude", document.getElementById("excludeInput").value);
  document.getElementById("excludeInput").value = "";
});

document.getElementById("includeInput").addEventListener("keydown", (e)=>{
  if(e.key === "Enter"){ e.preventDefault(); document.getElementById("addInclude").click(); }
});
document.getElementById("excludeInput").addEventListener("keydown", (e)=>{
  if(e.key === "Enter"){ e.preventDefault(); document.getElementById("addExclude").click(); }
});

document.getElementById("toggleFilter").addEventListener("click", () => {
  const filterSec = document.getElementById("filterSection");
  filterSec.classList.toggle("collapsed");
  const btn = document.getElementById("toggleFilter");
  btn.textContent = filterSec.classList.contains("collapsed") ? "Show Filters" : "Hide Filters";
});

document.getElementById("proposeBtn").addEventListener("click", onPropose);
document.getElementById("generateBtn").addEventListener("click", onPropose);


// "Aktuelle Auswahl" (von recipe.html gesetzt) nur anzeigen, wenn es eine gibt.
const currentPickRaw = localStorage.getItem('smartfood_current_pick');
if (currentPickRaw) {
  const currentPick = JSON.parse(currentPickRaw);
  const btnAddRecipe = document.getElementById('btnAddRecipe');
  btnAddRecipe.style.display = '';
  btnAddRecipe.textContent = `🛒 Weiter mit: ${currentPick.name}`; // zeigt den Rezeptnamen an
  btnAddRecipe.onclick = () => {
    location.href = window.SmartFoodUser.decorate(`/recipe?id=${encodeURIComponent(currentPick.id)}`);
  };
}

(async function boot(){
  await checkBackendOnline();
  await loadDefaultRecipes();
})();
</script>
</body>
</html>
