<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>SmartFood — Ingredient Manager</title>
  <style>
    :root {
      --bg: #0f172a;
      --panel: #111827;
      --muted: #94a3b8;
      --text: #e5e7eb;
      --accent: #22c55e;
      --accent2: #60a5fa;
      --alt: #a78bfa;
      --warn: #f59e0b;
      --danger: #ef4444;
      --shadow: 0 10px 20px rgba(0,0,0,0.25);
      --radius: 16px;
      --gap: 12px;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0; font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Ubuntu, Cantarell, Noto Sans, Helvetica, Arial;
      background: radial-gradient(1200px 800px at 80% -20%, rgba(96,165,250,0.08), transparent 60%),
                  radial-gradient(900px 600px at -10% 120%, rgba(34,197,94,0.07), transparent 60%),
                  var(--bg);
      color: var(--text);
    }
    header {
      display:flex; align-items:center; justify-content:space-between;
      padding: 22px 24px;
      position: sticky; top: 0;
      backdrop-filter: blur(8px);
      background: rgba(15,23,42,0.75);
      border-bottom: 1px solid rgba(148,163,184,0.15);
      z-index: 5;
    }
    h1 { font-size: 20px; margin: 0; letter-spacing: .3px; }
    .badge { font-size: 12px; color: var(--muted); }
    .container { display:grid; grid-template-columns: 1fr; gap: 18px; padding: 18px 24px 60px; align-items:start; }

    .card { background: linear-gradient(180deg, rgba(255,255,255,0.04), rgba(255,255,255,0.02)); border: 1px solid rgba(148,163,184,0.18); border-radius: var(--radius); box-shadow: var(--shadow); }
    .card h2 { margin: 0; font-size: 16px; padding: 16px 16px 0 16px; }
    .card .content { padding: 14px 16px 16px 16px; }
    .row { display:flex; gap: var(--gap); flex-wrap: wrap; }
    .col { flex: 1 1 0; min-width: 160px; }

    label { display:block; font-size: 12px; color: var(--muted); margin-bottom: 6px; }
    input[type="text"], input[type="number"], select {
      width: 100%;
      padding: 10px 12px;
      border-radius: 12px;
      border: 1px solid rgba(148,163,184,0.25);
      background: #0b1220;
      color: var(--text);
      outline: none;
    }
    input[type="number"]::-webkit-outer-spin-button, input[type="number"]::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
    .checkbox { display:flex; align-items:center; gap:8px; height:100%; }

    .btn {
      cursor:pointer;
      padding: 10px 14px;
      border-radius: 12px;
      border: 1px solid rgba(148,163,184,0.25);
      background:#0b1220;
      color: var(--text);
      white-space: nowrap;
    }
    .btn.primary { background: linear-gradient(180deg, rgba(34,197,94,0.18), rgba(34,197,94,0.05)); border-color: rgba(34,197,94,0.45); }
    .btn.danger { background: linear-gradient(180deg, rgba(239,68,68,0.15), rgba(239,68,68,0.05)); border-color: rgba(239,68,68,0.4); }
    .btn:disabled { opacity:.5; cursor: not-allowed; }

    table { width: 100%; border-collapse: collapse; font-size: 13px; }
    th, td { text-align:left; border-bottom:1px solid rgba(148,163,184,0.15); padding: 10px 6px; }
    th { color: var(--muted); font-weight: 600; }
    tr:hover td { background: rgba(148,163,184,0.05); }

    .pill { font-size: 11px; padding: 2px 8px; border-radius: 999px; border: 1px solid rgba(148,163,184,0.3); display:inline-block; }
    .pill.meat { border-color: rgba(248,113,113,0.6); color:#fecaca; }
    .pill.vegan { border-color: rgba(34,197,94,0.6); color:#bbf7d0; }
    .pill.fish { border-color: rgba(56,189,248,0.6); color:#bae6fd; }
    .pill.vegetarian { border-color: rgba(59,130,246,0.6); color:#bfdbfe; }

    .toolbar { display:flex; flex-wrap:wrap; gap:8px; align-items:center; }
    .status { font-size:12px; color: var(--muted); }
    .tablewrap { max-height: 480px; overflow:auto; }
  </style>
</head>
<body>
  <script src="/static/nav.js"></script>
  <header>
    <h1>SmartFood — Ingredient Manager <span id="sf-user-slot" style="display:inline-flex; align-items:center; gap:6px; vertical-align:middle; font-size:14px; font-weight:400;"></span></h1>
    <div class="toolbar">
      <button class="btn" onclick="location.href=window.SmartFoodUser.decorate('/')">🏠 Home</button>
      <span class="status" id="saveStatus">Loading…</span>
    </div>
  </header>

  <div class="container">
    <main class="card">
      <h2 id="formTitle">Neue Zutat</h2>
      <div class="content">
        <div class="row">
          <div class="col">
            <label>Name</label>
            <input id="ing_name" type="text" placeholder="z.B. Zwiebel" />
          </div>
          <div class="col">
            <label>Veg-Type</label>
            <select id="ing_veg">
              <option value="vegan">vegan</option>
              <option value="vegetarian">vegetarian</option>
              <option value="fish">fish</option>
              <option value="meat">meat</option>
            </select>
          </div>
          <div class="col">
            <label>Fleischsorte (nur bei meat / fish)</label>
            <select id="ing_meat_type">
              <option value="">— keine (z.B. Brühe) —</option>
              <option value="beef">Rind</option>
              <option value="pork">Schwein</option>
              <option value="poultry">Geflügel</option>
              <option value="lamb">Lamm</option>
              <option value="game">Wild</option>
              <option value="fish">Fisch</option>
              <option value="other">Sonstiges</option>
            </select>
          </div>
          <div class="col">
            <label>Standard-Einheit</label>
            <select id="ing_unit">
              <option value="">–</option>
              <option value="g">g</option>
              <option value="kg">kg</option>
              <option value="ml">ml</option>
              <option value="l">l</option>
              <option value="EL">EL</option>
              <option value="TL">TL</option>
              <option value="Stück">Stück</option>
              <option value="Prise">Prise</option>
              <option value="Bund">Bund</option>
              <option value="Scheibe">Scheibe</option>
              <option value="Packung">Packung</option>
              <option value="Dose">Dose</option>
              <option value="Becher">Becher</option>
              <option value="Zehe">Zehe</option>
            </select>
          </div>
          <div class="col">
            <label>Kategorie</label>
            <select id="ing_category">
              <option value="ingredient">Zutat</option>
              <option value="basic">Grundzutat (Wasser, Mehl, Zucker …)</option>
              <option value="spice">Gewürz (Sojasauce, Pfeffer, Salz …)</option>
            </select>
          </div>
          <div class="col" style="flex:0 0 120px;">
            <label class="checkbox" style="margin-top:22px;"><input id="ing_side" type="checkbox" /> <span>Side dish</span></label>
          </div>
        </div>

        <div class="row" style="margin-top:8px;">
          <div class="col">
            <label>Haltbarkeit (Tage)</label>
            <input id="ing_shelf_life" type="number" min="0" placeholder="z.B. 14" />
          </div>
          <div class="col">
            <label>Kalorien (kcal / Einheit)</label>
            <input id="ing_kcal" type="number" min="0" step="any" />
          </div>
          <div class="col">
            <label>Protein (g / Einheit)</label>
            <input id="ing_protein" type="number" min="0" step="any" />
          </div>
          <div class="col">
            <label>Kohlenhydrate (g / Einheit)</label>
            <input id="ing_carbs" type="number" min="0" step="any" />
          </div>
          <div class="col">
            <label>Fett (g / Einheit)</label>
            <input id="ing_fat" type="number" min="0" step="any" />
          </div>
        </div>
        <div class="row">
          <div class="col">
            <span class="hint" style="font-size:12px; opacity:.75;">Nährwerte gelten pro Standard-Einheit der Zutat (z.B. pro Stück, pro EL, pro g) – die Einheit im Rezept darf eine andere sein.</span>
          </div>
        </div>

        <div class="row" style="margin-top:8px;">
          <div class="col">
            <label>Laktosefrei</label>
            <select id="ing_lactose">
              <option value="">unbekannt</option>
              <option value="true">ja</option>
              <option value="false">nein</option>
            </select>
          </div>
          <div class="col">
            <label>Glutenfrei</label>
            <select id="ing_gluten">
              <option value="">unbekannt</option>
              <option value="true">ja</option>
              <option value="false">nein</option>
            </select>
          </div>
        </div>

        <div class="row" style="margin-top:14px;">
          <div class="col" style="flex:0 0 auto;">
            <button class="btn primary" id="saveIngredient">Save new</button>
          </div>
          <div class="col" style="flex:0 0 auto;">
            <button class="btn" id="updateIngredient" disabled>Update</button>
          </div>
          <div class="col" style="flex:0 0 auto;">
            <button class="btn" id="clearIngredientForm">Clear</button>
          </div>
        </div>
      </div>
    </main>

    <main class="card">
      <h2>Zutaten (<span id="ingCount">0</span>)</h2>
      <div class="content">
        <div class="row" style="margin-bottom:10px;">
          <div class="col">
            <input id="ing_search" type="text" placeholder="Suchen…" />
          </div>
        </div>
        <div class="tablewrap">
          <table id="ingredientsTable">
            <thead><tr>
              <th>ID</th><th>Name</th><th>Veg</th><th>Fleisch</th><th>Kategorie</th><th>Einheit</th><th>Haltbarkeit</th>
              <th>kcal</th><th>Protein</th><th>KH</th><th>Fett</th><th>Side</th><th>Laktosefrei</th><th>Glutenfrei</th><th></th>
            </tr></thead>
            <tbody></tbody>
          </table>
        </div>
      </div>
    </main>
  </div>

<script>
  const $ = (sel) => document.querySelector(sel);

  let ingredients = [];
  let recipes = [];
  let recipeIngredients = [];
  let history = [];
  let users = [];

  let selectedIngredientId = null;

  function setStatus(msg) { $('#saveStatus').textContent = msg; }

  function escapeHtml(s) {
    return (s ?? '').toString()
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  }

  function nextId(list, key) {
    return list.reduce((max, r) => Math.max(max, Number(r[key]) || 0), 0) + 1;
  }

  function findIngredientByNormalizedName(name) {
    const norm = name.trim().toLowerCase();
    return ingredients.find(i => (i.name || '').trim().toLowerCase() === norm);
  }

  function clearForm() {
    $('#ing_name').value = '';
    $('#ing_veg').value = 'vegan';
    $('#ing_meat_type').value = '';
    $('#ing_category').value = 'ingredient';
    $('#ing_unit').value = '';
    $('#ing_side').checked = false;
    $('#ing_shelf_life').value = '';
    $('#ing_kcal').value = '';
    $('#ing_protein').value = '';
    $('#ing_carbs').value = '';
    $('#ing_fat').value = '';
    $('#ing_lactose').value = '';
    $('#ing_gluten').value = '';
    selectedIngredientId = null;
    $('#updateIngredient').disabled = true;
    $('#formTitle').textContent = 'Neue Zutat';
  }

  function loadIngredientIntoForm(ing) {
    selectedIngredientId = Number(ing.ingredient_id);
    $('#ing_name').value = ing.name || '';
    $('#ing_veg').value = ing.veg_type || 'vegan';
    $('#ing_meat_type').value = ing.meat_type || '';
    $('#ing_category').value = ing.category || (ing.spice ? 'spice' : 'ingredient');
    $('#ing_unit').value = ing.unit ?? '';
    $('#ing_side').checked = !!ing.side_dish;
    $('#ing_shelf_life').value = ing.shelf_life_days ?? '';
    $('#ing_kcal').value = ing.kcal ?? '';
    $('#ing_protein').value = ing.protein ?? '';
    $('#ing_carbs').value = ing.carbs ?? '';
    $('#ing_fat').value = ing.fat ?? '';
    $('#ing_lactose').value = triToSelect(ing.lactose_free);
    $('#ing_gluten').value = triToSelect(ing.gluten_free);
    $('#updateIngredient').disabled = false;
    $('#formTitle').textContent = `Zutat bearbeiten (ID ${ing.ingredient_id})`;
  }

  function readFormValues() {
    const numOrNull = (v) => (v === '' || v === null || v === undefined) ? null : Number(v);
    // Reihenfolge = Format in ingredients.yaml (YamlEditor.INGREDIENT_FIELDS)
    return {
      name: $('#ing_name').value.trim(),
      unit: $('#ing_unit').value || null,
      veg_type: $('#ing_veg').value,
      // Fleischsorte zaehlt nur bei Fleisch-Zutaten (YamlEditor.MEAT_TYPES), sonst null
      meat_type: ['meat', 'fish'].includes($('#ing_veg').value) ? ($('#ing_meat_type').value || null) : null,
      category: $('#ing_category').value || 'ingredient',
      side_dish: $('#ing_side').checked,
      lactose_free: selectToTri($('#ing_lactose').value),
      gluten_free: selectToTri($('#ing_gluten').value),
      shelf_life_days: numOrNull($('#ing_shelf_life').value),
      kcal: numOrNull($('#ing_kcal').value),
      protein: numOrNull($('#ing_protein').value),
      carbs: numOrNull($('#ing_carbs').value),
      fat: numOrNull($('#ing_fat').value),
    };
  }

  const CATEGORY_LABEL = { ingredient: 'Zutat', basic: 'Grundzutat', spice: 'Gewürz' };
  const MEAT_LABEL = { beef: 'Rind', pork: 'Schwein', poultry: 'Geflügel', lamb: 'Lamm', game: 'Wild', fish: 'Fisch', other: 'Sonstiges' };

  // lactose_free / gluten_free: true / false / null (= unbekannt, filtert nicht)
  function triToSelect(v) { return v === true ? 'true' : v === false ? 'false' : ''; }
  function selectToTri(v) { return v === '' ? null : v === 'true'; }

  function saveNewIngredient() {
    const v = readFormValues();
    if (!v.name) { alert('Name erforderlich'); return; }

    const existing = findIngredientByNormalizedName(v.name);
    if (existing) {
      alert(`Zutat "${existing.name}" existiert bereits (ID ${existing.ingredient_id}) - bitte stattdessen bearbeiten.`);
      loadIngredientIntoForm(existing);
      return;
    }

    const ingredient_id = nextId(ingredients, 'ingredient_id');
    ingredients.push({ ingredient_id, ...v });

    clearForm();
    renderIngredients();
    scheduleSave();
  }

  function updateIngredient() {
    if (!selectedIngredientId) return;
    const ing = ingredients.find(i => Number(i.ingredient_id) === Number(selectedIngredientId));
    if (!ing) return;

    const v = readFormValues();
    if (!v.name) { alert('Name erforderlich'); return; }

    Object.assign(ing, v);

    clearForm();
    renderIngredients();
    scheduleSave();
  }

  function deleteIngredient(id) {
    const usedInRecipes = recipeIngredients.some(ri => Number(ri.ingredient_id) === Number(id));
    if (usedInRecipes && !confirm(`Diese Zutat wird noch in Rezepten verwendet. Trotzdem loeschen? Das entfernt sie auch aus allen Rezepten.`)) return;

    ingredients = ingredients.filter(i => Number(i.ingredient_id) !== Number(id));
    recipeIngredients = recipeIngredients.filter(ri => Number(ri.ingredient_id) !== Number(id));

    if (Number(selectedIngredientId) === Number(id)) clearForm();
    renderIngredients();
    scheduleSave();
  }

  function renderIngredients() {
    const tbody = $('#ingredientsTable tbody');
    tbody.innerHTML = '';

    const term = ($('#ing_search').value || '').toLowerCase();
    const filtered = ingredients.filter(i => (i.name || '').toLowerCase().includes(term));

    $('#ingCount').textContent = ingredients.length;

    for (const ing of filtered) {
      const tr = document.createElement('tr');
      tr.style.cursor = 'pointer';
      tr.innerHTML = `
        <td>${ing.ingredient_id}</td>
        <td>${escapeHtml(ing.name)}</td>
        <td><span class="pill ${ing.veg_type}">${ing.veg_type}</span></td>
        <td>${MEAT_LABEL[ing.meat_type] ?? ''}</td>
        <td>${CATEGORY_LABEL[ing.category] ?? 'Zutat'}</td>
        <td>${escapeHtml(ing.unit ?? '')}</td>
        <td>${ing.shelf_life_days ?? ''}</td>
        <td>${ing.kcal ?? ''}</td>
        <td>${ing.protein ?? ''}</td>
        <td>${ing.carbs ?? ''}</td>
        <td>${ing.fat ?? ''}</td>
        <td>${ing.side_dish ? '✓' : ''}</td>
        <td>${ing.lactose_free === true ? '✓' : ing.lactose_free === false ? '✗' : ''}</td>
        <td>${ing.gluten_free === true ? '✓' : ing.gluten_free === false ? '✗' : ''}</td>
        <td><button class="btn danger" data-del="${ing.ingredient_id}" type="button">Delete</button></td>
      `;
      tr.addEventListener('click', (e) => {
        if (e.target?.dataset?.del) return;
        loadIngredientIntoForm(ing);
      });
      tbody.appendChild(tr);
    }

    tbody.querySelectorAll('button[data-del]').forEach(btn => {
      btn.addEventListener('click', (e) => {
        e.stopPropagation();
        deleteIngredient(Number(btn.dataset.del));
      });
    });
  }

  // ---------------------- Server I/O ----------------------
  // Round-Trip ueber /api/all wie in creation.html: recipes / recipe_ingredients werden nur durchgereicht.
  // history / users werden nicht mitgeschickt (save_all laesst nicht mitgeschickte Dateien unveraendert).
  let saveTimer = null;
  function scheduleSave() {
    setStatus('Saving…');
    clearTimeout(saveTimer);
    saveTimer = setTimeout(saveAll, 250);
  }

  async function saveAll() {
    try {
      // history / users nicht mitschicken: save_all schreibt nur mitgeschickte Collections - eine alte
      // Kopie wuerde sonst Bewertungen ueberschreiben, die seit dem Laden der Seite dazugekommen sind
      const payload = { ingredients, recipes, recipe_ingredients: recipeIngredients };
      const res = await fetch('/api/all', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      });
      if (!res.ok) throw new Error('HTTP ' + res.status);
      setStatus('Saved');
    } catch (e) {
      console.error(e);
      setStatus('Save failed (server running?)');
    }
  }

  async function loadAll() {
    try {
      const res = await fetch('/api/all');
      if (!res.ok) throw new Error('HTTP ' + res.status);
      const data = await res.json();

      ingredients = Array.isArray(data.ingredients) ? data.ingredients : [];
      recipes = Array.isArray(data.recipes) ? data.recipes : [];
      recipeIngredients = Array.isArray(data.recipe_ingredients) ? data.recipe_ingredients : [];
      history = Array.isArray(data.history) ? data.history : [];
      users = Array.isArray(data.users) ? data.users : [];

      renderIngredients();
      setStatus('Loaded');
    } catch (e) {
      console.error(e);
      setStatus('Offline (open via server for auto-save)');
      renderIngredients();
    }
  }

  $('#saveIngredient').addEventListener('click', saveNewIngredient);
  $('#updateIngredient').addEventListener('click', updateIngredient);
  $('#clearIngredientForm').addEventListener('click', clearForm);
  $('#ing_search').addEventListener('input', renderIngredients);

  loadAll();
</script>
</body>
</html>
